<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111;
            color: #ccc;
            font-family: monospace;
            overflow: hidden;
        }

        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
        }

        .overlay {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
            padding: 15px;
            z-index: 1000;
        }

        .timeline {
            height: 40px;
            background: #1a1a1a;
            border-radius: 4px;
            position: relative;
            margin-bottom: 10px;
        }

        .keyframe-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #6a8;
            border-radius: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.1s;
        }

        .keyframe-dot.flash {
            transform: translate(-50%, -50%) scale(2);
            background: #8fc;
        }

        .keyframe-dot:hover {
            cursor: pointer;
            background: #c66;
        }

        .playhead {
            position: absolute;
            width: 2px;
            height: 100%;
            background: #f80;
            top: 0;
            left: 0;
        }

        .status {
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
        }

        .status span {
            margin-right: 20px;
        }

        .mode {
            color: #f80;
            font-weight: bold;
        }

        .buttons {
            display: none;
            gap: 10px;
            margin-left: auto;
        }

        .buttons.visible {
            display: flex;
        }

        .btn {
            background: #333;
            border: 1px solid #555;
            color: #ccc;
            padding: 5px 15px;
            cursor: pointer;
            font-family: monospace;
            font-size: 12px;
        }

        .btn:hover {
            background: #444;
            border-color: #777;
        }

        .hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #444;
            pointer-events: none;
        }

        .hint.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <iframe id="demo"></iframe>
    
    <div class="hint" id="hint">tap space to start</div>
    
    <div class="overlay">
        <div class="timeline" id="timeline">
            <div class="playhead" id="playhead"></div>
        </div>
        <div class="status">
            <span class="mode" id="mode">stopped</span>
            <span id="time">t: 0.00s</span>
            <span id="scroll">scroll: 0%</span>
            <span id="keyframes">keyframes: 0</span>
            <div class="buttons" id="buttons">
                <button class="btn" id="btn-replay">Replay</button>
                <button class="btn" id="btn-new">New</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'timeline-keyframes';
        const DOUBLE_TAP_MS = 300;

        const iframe = document.getElementById('demo');
        const timeline = document.getElementById('timeline');
        const playhead = document.getElementById('playhead');
        const timeEl = document.getElementById('time');
        const scrollEl = document.getElementById('scroll');
        const keyframesEl = document.getElementById('keyframes');
        const modeEl = document.getElementById('mode');
        const hintEl = document.getElementById('hint');
        const buttonsEl = document.getElementById('buttons');
        const btnReplay = document.getElementById('btn-replay');
        const btnNew = document.getElementById('btn-new');

        // State
        let keyframes = [];
        let totalDuration = 0;
        let recordingStartTime = null;
        let playbackStartTime = null;
        let pausedAt = 0; // track where we paused during playback
        let state = 'stopped'; // stopped, recording, playing, paused, ended
        let lastTapTime = 0;
        let lastDotClickTime = 0;
        let iframeLoaded = false;

        // Load from localStorage
        function loadKeyframes() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    keyframes = JSON.parse(saved);
                    if (keyframes.length > 0) {
                        totalDuration = keyframes[keyframes.length - 1].t;
                        console.log('Loaded keyframes from localStorage:', keyframes);
                        return true;
                    }
                }
            } catch (e) {
                console.error('Failed to load keyframes:', e);
            }
            return false;
        }

        // Save to localStorage
        function saveKeyframes() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(keyframes));
                console.log('Saved keyframes:', keyframes);
            } catch (e) {
                console.error('Failed to save keyframes:', e);
            }
        }

        function getIframeScroll() {
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                const maxScroll = doc.documentElement.scrollHeight - iframe.contentWindow.innerHeight;
                return maxScroll > 0 ? iframe.contentWindow.scrollY / maxScroll : 0;
            } catch (e) {
                return 0;
            }
        }

        function setIframeScroll(scrollProgress) {
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                const maxScroll = doc.documentElement.scrollHeight - iframe.contentWindow.innerHeight;
                iframe.contentWindow.scrollTo(0, scrollProgress * maxScroll);
            } catch (e) {
                console.error('Cannot access iframe:', e);
            }
        }

        function renderKeyframes() {
            timeline.querySelectorAll('.keyframe-dot').forEach(el => el.remove());
            
            if (totalDuration > 0) {
                keyframes.forEach((kf, i) => {
                    const dot = document.createElement('div');
                    dot.className = 'keyframe-dot';
                    dot.id = `kf-${i}`;
                    dot.style.left = `${(kf.t / totalDuration) * 100}%`;
                    
                    // Double-click to remove
                    dot.addEventListener('click', () => {
                        const now = Date.now();
                        if (now - lastDotClickTime < DOUBLE_TAP_MS) {
                            removeKeyframe(i);
                        }
                        lastDotClickTime = now;
                    });
                    
                    timeline.appendChild(dot);
                });
            }
            
            keyframesEl.textContent = `keyframes: ${keyframes.length}`;
        }

        function removeKeyframe(index) {
            if (keyframes.length <= 2) {
                console.log('Need at least 2 keyframes');
                return;
            }
            
            keyframes.splice(index, 1);
            totalDuration = keyframes[keyframes.length - 1].t;
            renderKeyframes();
            saveKeyframes();
            console.log(`Removed keyframe ${index}, ${keyframes.length} remaining`);
        }

        function flashKeyframe(index) {
            const dot = document.getElementById(`kf-${index}`);
            if (dot) {
                dot.classList.add('flash');
                setTimeout(() => dot.classList.remove('flash'), 150);
            }
        }

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function getScrollAtTime(t) {
            if (keyframes.length === 0) return 0;
            if (keyframes.length === 1) return keyframes[0].scroll;
            
            let before = keyframes[0];
            let after = keyframes[keyframes.length - 1];
            
            for (let i = 0; i < keyframes.length - 1; i++) {
                if (t >= keyframes[i].t && t <= keyframes[i + 1].t) {
                    before = keyframes[i];
                    after = keyframes[i + 1];
                    break;
                }
            }
            
            if (t <= before.t) return before.scroll;
            if (t >= after.t) return after.scroll;
            
            const progress = (t - before.t) / (after.t - before.t);
            const eased = progress < 0.5 
                ? 2 * progress * progress 
                : 1 - Math.pow(-2 * progress + 2, 2) / 2;
            
            return lerp(before.scroll, after.scroll, eased);
        }

        function updateUI(t, scroll) {
            if (totalDuration > 0) {
                playhead.style.left = `${(t / totalDuration) * 100}%`;
            } else {
                playhead.style.left = '0%';
            }
            timeEl.textContent = `t: ${(t / 1000).toFixed(2)}s`;
            scrollEl.textContent = `scroll: ${(scroll * 100).toFixed(0)}%`;
        }

        function setState(newState) {
            state = newState;
            modeEl.textContent = state;
            hintEl.classList.toggle('hidden', state !== 'stopped');
            buttonsEl.classList.toggle('visible', state === 'ended' || state === 'paused');
        }

        // Recording loop - just updates UI, doesn't control scroll
        function recordingLoop(timestamp) {
            if (state !== 'recording') return;
            
            const elapsed = timestamp - recordingStartTime;
            const scroll = getIframeScroll();
            updateUI(elapsed, scroll);
            
            requestAnimationFrame(recordingLoop);
        }

        // Playback loop - controls scroll
        function playbackLoop(timestamp) {
            if (state !== 'playing') return;
            
            if (!playbackStartTime) playbackStartTime = timestamp - pausedAt;
            const elapsed = timestamp - playbackStartTime;
            
            // Loop
            const t = elapsed % totalDuration;
            const scroll = getScrollAtTime(t);
            setIframeScroll(scroll);
            updateUI(t, scroll);
            
            // Store current position for pause/resume
            pausedAt = t;
            
            requestAnimationFrame(playbackLoop);
        }

        function pausePlayback() {
            setState('paused');
        }

        function addKeyframeAtPause() {
            const scroll = getIframeScroll();
            
            // Find where to insert based on pausedAt time
            let insertIndex = keyframes.length;
            for (let i = 0; i < keyframes.length; i++) {
                if (keyframes[i].t > pausedAt) {
                    insertIndex = i;
                    break;
                }
            }
            
            keyframes.splice(insertIndex, 0, { t: pausedAt, scroll });
            renderKeyframes();
            saveKeyframes();
            flashKeyframe(insertIndex);
            console.log(`Added keyframe at t=${(pausedAt/1000).toFixed(2)}s scroll=${(scroll*100).toFixed(0)}%`);
        }

        function loadIframe(onReady) {
            if (iframeLoaded) {
                onReady();
                return;
            }
            
            hintEl.textContent = 'loading...';
            iframe.onload = () => {
                iframeLoaded = true;
                console.log('Demo loaded');
                onReady();
            };
            iframe.src = '../../experiments/04-langevin-chaos/index.html';
        }

        function startRecording() {
            keyframes = [];
            totalDuration = 0;
            recordingStartTime = performance.now();
            setState('recording');
            renderKeyframes();
            
            // Record first keyframe immediately
            recordKeyframe();
            
            requestAnimationFrame(recordingLoop);
        }

        function recordKeyframe() {
            const t = performance.now() - recordingStartTime;
            const scroll = getIframeScroll();
            
            keyframes.push({ t, scroll });
            totalDuration = t;
            renderKeyframes();
            flashKeyframe(keyframes.length - 1);
            
            console.log(`Keyframe ${keyframes.length}: t=${(t/1000).toFixed(2)}s scroll=${(scroll*100).toFixed(0)}%`);
        }

        function endRecording() {
            setState('ended');
            saveKeyframes();
        }

        function startPlayback(fromPause = false) {
            if (keyframes.length < 2) {
                console.log('Need at least 2 keyframes to play');
                return;
            }
            playbackStartTime = null;
            if (!fromPause) {
                pausedAt = 0;
            }
            setState('playing');
            if (!fromPause) {
                setIframeScroll(keyframes[0].scroll);
            }
            requestAnimationFrame(playbackLoop);
        }

        function reset() {
            setState('stopped');
            setIframeScroll(0);
            playhead.style.left = '0%';
            updateUI(0, 0);
        }

        // Space bar handling
        document.addEventListener('keydown', (e) => {
            if (e.code !== 'Space') return;
            e.preventDefault();
            
            const now = Date.now();
            const isDoubleTap = (now - lastTapTime) < DOUBLE_TAP_MS;
            lastTapTime = now;
            
            if (isDoubleTap) {
                // Double tap
                if (state === 'recording') {
                    endRecording();
                } else if (state === 'playing') {
                    pausePlayback();
                }
            } else {
                // Single tap (delayed to detect double)
                setTimeout(() => {
                    if (Date.now() - lastTapTime >= DOUBLE_TAP_MS) {
                        if (state === 'stopped') {
                            loadIframe(() => startRecording());
                        } else if (state === 'recording') {
                            recordKeyframe();
                        } else if (state === 'paused') {
                            addKeyframeAtPause();
                        }
                    }
                }, DOUBLE_TAP_MS);
            }
        });

        // Buttons
        btnReplay.addEventListener('click', () => {
            if (state === 'paused') {
                // Resume from pause
                pausedAt = 0;
                startPlayback(false);
            } else {
                loadIframe(() => startPlayback());
            }
        });

        btnNew.addEventListener('click', () => {
            keyframes = [];
            totalDuration = 0;
            iframeLoaded = false;
            iframe.src = '';
            renderKeyframes();
            reset();
        });

        // Init
        if (loadKeyframes()) {
            renderKeyframes();
            hintEl.textContent = 'tap space to start (has saved data)';
        }
    </script>
</body>
</html>
