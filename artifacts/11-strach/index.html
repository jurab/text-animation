<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="scrap-title" content="Strach">
  <title>Strach</title>
  <style>
    @font-face {
      font-family: 'ADolphin';
      src: url('../../materials/fonts/ADolphin-Roman.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      position: fixed;
      width: 100%;
      background: #000;
      font-family: 'ADolphin', Georgia, serif;
      color: #e8e4d9;
      overscroll-behavior: none;
    }

    .container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    .letter {
      position: fixed;
      left: 0;
      top: 0;
      font-size: 28px;
      will-change: transform, opacity;
      pointer-events: none;
    }

    .anchor {
      position: fixed;
      left: 0;
      top: 0;
      font-size: 28px;
      pointer-events: none;
    }

    .debug {
      position: fixed;
      top: 10px;
      left: 10px;
      color: #666;
      font-family: monospace;
      font-size: 12px;
      z-index: 1000;
    }

    .hint {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: #333;
      font-size: 12px;
      transition: opacity 0.5s;
    }

    .lang-switch {
      position: fixed;
      left: 10px;
      top: 28px;
      display: flex;
      gap: 4px;
      z-index: 1000;
    }

    .lang-btn {
      background: transparent;
      border: 1px solid #333;
      color: #555;
      font-size: 10px;
      padding: 2px 6px;
      cursor: pointer;
      font-family: monospace;
      transition: all 0.2s;
    }

    .lang-btn:hover {
      color: #888;
      border-color: #555;
    }

    .lang-btn.active {
      color: #e8e4d9;
      border-color: #e8e4d9;
    }

    .line-nav {
      position: fixed;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 2px;
      z-index: 1000;
    }

    .line-nav-item {
      font-size: 9px;
      color: #333;
      cursor: pointer;
      padding: 2px 4px;
      transition: color 0.2s;
    }

    .line-nav-item:hover {
      color: #666;
    }

    .line-nav-item.active {
      color: #e8e4d9;
    }

    .controls {
      position: fixed;
      right: 10px;
      top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 1000;
      font-family: monospace;
      font-size: 9px;
      color: #444;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .control-row label {
      width: 50px;
      text-align: right;
    }

    .control-row input[type="range"] {
      width: 160px;
      height: 4px;
      -webkit-appearance: none;
      background: #222;
      outline: none;
    }

    .control-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 8px;
      height: 8px;
      background: #666;
      cursor: pointer;
    }

    .control-row .value {
      width: 30px;
      color: #555;
    }

    .timeline-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 195px;
      background: #111;
      border-top: 1px solid #333;
      display: flex;
      flex-direction: column;
      z-index: 1001;
    }

    .timeline-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 10px;
      border-bottom: 1px solid #222;
    }

    .transport-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .play-btn {
      background: #222;
      border: 1px solid #444;
      color: #e8e4d9;
      width: 32px;
      height: 24px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-btn:hover {
      background: #333;
    }

    .time-display {
      font-family: monospace;
      font-size: 11px;
      color: #888;
      min-width: 40px;
    }

    .bpm-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bpm-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .bpm-group label {
      font-family: monospace;
      font-size: 9px;
      color: #555;
    }

    .bpm-input {
      width: 44px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #e8e4d9;
      font-family: monospace;
      font-size: 11px;
      padding: 2px 4px;
      text-align: center;
    }

    .bpm-input:focus {
      outline: none;
      border-color: #555;
    }

    .tap-btn {
      background: #222;
      border: 1px solid #333;
      color: #666;
      font-size: 9px;
      padding: 2px 6px;
      cursor: pointer;
    }

    .tap-btn:hover {
      background: #333;
      color: #e8e4d9;
    }

    .gap-slider {
      width: 60px;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: #333;
      border-radius: 2px;
      cursor: pointer;
    }

    .gap-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      background: #666;
      border-radius: 50%;
    }

    .gap-slider::-webkit-slider-thumb:hover {
      background: #888;
    }

    .toolbar-spacer {
      flex: 1;
    }

    .segment-duration {
      font-family: monospace;
      font-size: 11px;
      color: #6a6;
    }

    .timeline-tracks {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      position: relative;
      padding: 4px 10px 8px;
      overflow: hidden;
      min-height: 0;
    }

    .track {
      position: relative;
      cursor: crosshair;
    }

    .track-transitions {
      height: 28px;
    }

    .track-overdrives {
      height: 24px;
    }

    .track-silences {
      height: 24px;
    }

    .track-segment {
      height: 20px;
    }

    .track-waveform {
      flex: 1;
      min-height: 0;
      cursor: grab;
      overflow: hidden;
    }

    .track canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .track-label {
      position: absolute;
      left: 4px;
      top: 50%;
      transform: translateY(-50%);
      font-family: monospace;
      font-size: 8px;
      color: #444;
      pointer-events: none;
    }

    #playheadLine {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #e8e4d9;
      pointer-events: none;
      z-index: 10;
    }

    #beatIndicator {
      position: absolute;
      top: -40px;
      left: 0;
      transform: translateX(-50%);
      font-family: monospace;
      font-size: 24px;
      font-weight: bold;
      color: rgb(80, 180, 220);
      text-shadow: 0 0 10px rgba(80, 180, 220, 0.8);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s;
      z-index: 100;
    }

    #beatIndicator.visible {
      opacity: 1;
    }

  </style>
</head>
<body>
  <div class="container" id="container"></div>
  <div class="anchor" id="anchor">Strach</div>
  <div class="lang-switch" id="langSwitch">
    <button class="lang-btn active" data-lang="cz">cz</button>
    <button class="lang-btn" data-lang="en">en</button>
  </div>
  <div class="line-nav" id="lineNav"></div>
  <div class="debug" id="debug">line: 0 | word: 0</div>
  <div class="hint" id="hint">← → | ⏎ sync | ␣ OD</div>
  <div class="controls" id="controls">
    <div class="control-row">
      <label>freq</label>
      <input type="range" id="glitchFreq" min="0" max="200" value="100">
      <span class="value" id="glitchFreqVal">100%</span>
    </div>
    <div class="control-row">
      <label>pos</label>
      <input type="range" id="glitchPos" min="0" max="100" value="50">
      <span class="value" id="glitchPosVal">50</span>
    </div>
    <div class="control-row">
      <label>opacity</label>
      <input type="range" id="glitchOpacity" min="0" max="128" value="64">
      <span class="value" id="glitchOpacityVal">64</span>
    </div>
    <div class="control-row">
      <label>tear</label>
      <input type="range" id="glitchTear" min="0" max="200" value="100">
      <span class="value" id="glitchTearVal">100</span>
    </div>
    <div class="control-row">
      <label>OD</label>
      <input type="range" id="glitchOD" min="1" max="7" value="4">
      <span class="value" id="glitchODVal">4x</span>
    </div>
  </div>

  <div class="timeline-panel" id="timelinePanel">
    <div class="timeline-toolbar">
      <div class="transport-controls">
        <button class="play-btn" id="playBtn">▶</button>
        <div class="time-display" id="timeDisplay">0:00</div>
      </div>
      <div class="bpm-controls">
        <div class="bpm-group">
          <label>bpm</label>
          <input type="number" class="bpm-input" id="bpmInput" value="153" min="60" max="240">
        </div>
        <div class="bpm-group">
          <label>offset</label>
          <input type="number" class="bpm-input" id="offsetInput" value="0" min="0" step="0.01">
          <button class="tap-btn" id="tapOffsetBtn">tap</button>
        </div>
        <div class="bpm-group">
          <label>gap</label>
          <input type="range" class="gap-slider" id="gapSlider" min="0" max="100" value="0">
        </div>
      </div>
      <div class="toolbar-spacer"></div>
      <div class="segment-duration" id="segmentDuration">0:00</div>
    </div>
    <div class="timeline-tracks" id="timelineTracks">
      <div class="track track-transitions" id="transitionsTrack">
        <canvas id="transitionsCanvas"></canvas>
        <span class="track-label">trans</span>
      </div>
      <div class="track track-overdrives" id="overdrivesTrack">
        <canvas id="overdrivesCanvas"></canvas>
        <span class="track-label">OD</span>
      </div>
      <div class="track track-silences" id="silencesTrack">
        <canvas id="silencesCanvas"></canvas>
        <span class="track-label">mute</span>
      </div>
      <div class="track track-segment" id="segmentTrack">
        <canvas id="segmentCanvas"></canvas>
        <span class="track-label">seg</span>
      </div>
      <div class="track track-waveform" id="waveformTrack">
        <canvas id="waveformCanvas"></canvas>
      </div>
      <div id="playheadLine"></div>
    </div>
    <div id="beatIndicator"></div>
  </div>

  <script>
    // Lines in both languages
    const LINES_CZ = [
      "Strach, že si pro mě přijdou",
      "Strach, že zaspim",
      "Strach, že ani neusnu",
      "Strach, že vstane minulost",
      "Strach, že odejde dnešek",
      "Strach, že mi v noci někdo zavolá",
      "Strach, že je to někdo koho neznám",
      "Strach, že ho znám",
      "Strach z úzkosti!",
      "Strach, že najdu Tvoje tělo",
      "Strach, že mi dojdou peníze",
      "Strach, že mě psychologicky profiluješ",
      "Strach, že uvidím mámu stárnout",
      "Strach, že uvidim stárnout sebe",
      "Strach, že se vzbudim a nebudeš tu",
      "Strach, že budu milovat",
      "Strach, že nebudu milovat dost",
      "Strach ze smrti",
      "Strach, že budu žít až moc dlouho",
      "Strach ze smrti",
      "Jo, to sem říkal"  // finale line - no anchor, centered
    ];

    const LINES_EN = [
      "Fear of seeing a police car pull into the drive.",
      "Fear of falling asleep at night.",
      "Fear of not falling asleep.",
      "Fear of the past rising up.",
      "Fear of the present taking flight.",
      "Fear of the telephone that rings in the dead of night.",
      "Fear of electrical storms.",
      "Fear of the cleaning woman who has a spot on her cheek!",
      "Fear of dogs I've been told won't bite.",
      "Fear of anxiety!",
      "Fear of having to identify the body of a dead friend.",
      "Fear of running out of money.",
      "Fear of having too much, though people will not believe this.",
      "Fear of psychological profiles.",
      "Fear of being late and fear of arriving before anyone else.",
      "Fear of my children's handwriting on envelopes.",
      "Fear they'll die before I do, and I'll feel guilty.",
      "Fear of having to live with my mother in her old age, and mine.",
      "Fear of confusion.",
      "Fear this day will end on an unhappy note.",
      "Fear of waking up to find you gone.",
      "Fear of not loving and fear of not loving enough.",
      "Fear that what I love will prove lethal to those I love.",
      "Fear of death.",
      "Fear of living too long.",
      "Fear of death.",
      "I've said that."  // finale line - no anchor, centered
    ];

    const LANG_CONFIG = {
      cz: { lines: LINES_CZ, anchor: "Strach", anchorLen: 6 },
      en: { lines: LINES_EN, anchor: "Fear", anchorLen: 4 }
    };

    let currentLang = 'cz';
    let LINES = [];

    function parseLines(lang) {
      const config = LANG_CONFIG[lang];
      const raw = config.lines;
      const anchorLen = config.anchorLen;
      const finaleIdx = raw.length - 1;

      return raw.map((line, i) => {
        if (i === finaleIdx) {
          const words = line.match(/[^\s]+/g) || [];
          return { full: line, rest: line, words, isFinale: true };
        }
        const rest = line.substring(anchorLen);
        const words = rest.match(/[^\s]+/g) || [];
        return { full: line, rest, words, isFinale: false };
      });
    }

    LINES = parseLines(currentLang);

    // Build character pool - count max occurrences per char across lines (excluding "Strach")
    function buildPool() {
      const maxCounts = {};
      LINES.forEach(line => {
        const counts = {};
        for (const c of line.rest) {
          if (c === ' ') continue;
          counts[c] = (counts[c] || 0) + 1;
        }
        for (const [c, count] of Object.entries(counts)) {
          maxCounts[c] = Math.max(maxCounts[c] || 0, count);
        }
      });

      // Create pool array
      const pool = [];
      for (const [char, count] of Object.entries(maxCounts)) {
        for (let i = 0; i < count; i++) {
          pool.push(char);
        }
      }
      return pool;
    }

    // Langevin physics constants
    const TEMPERATURE = 0.15;
    const DAMPING = 0.3;
    const ORBITAL_STRENGTH = 0.002;  // tangential force for orbiting
    const MARGIN_RADIUS = 80;        // minimum distance from center
    const MARGIN_FORCE = 0.3;        // push force when inside margin
    const WELL_STRENGTH = 0.12;      // pull to target when locked
    const CLOUD_RADIUS = 180;        // preferred orbital distance
    const CLOUD_PULL = 0.01;         // gentle pull to cloud radius
    const REPULSION_STRENGTH = 150;  // inter-letter repulsion
    const REPULSION_RANGE = 50;      // distance below which repulsion kicks in
    const DT = 1.0;

    // Vibration synced to BPM
    let bpm = 153;
    let bpmOffset = 0;          // seconds - where beat 1 starts
    let beatMs = 60000 / bpm;   // ~392ms per beat
    const VIBRATION_AMPLITUDE = 1.2;

    // Glitch state
    let glitchActive = false;
    let glitchStartTime = 0;
    let glitchDuration = 80;  // ms
    let lastBeat = -1;
    let beatOffset = 0;       // for syncing with enter key
    let glitchLetters = [];  // which letters are affected
    let glitchTearY = 0;     // y position of tear line

    // Glitch settings (controlled by sliders)
    let glitchFreq = 1.0;       // probability per beat
    let glitchPosStrength = 0.5;
    let glitchOpacityStrength = 0.64;
    let glitchTearStrength = 1.0;
    let spacebarOverdrive = false;  // space bar held
    let overdrive = false;          // computed: timeline region OR spacebar
    let overdriveMultiplier = 4;    // 2x to 10x

    let letters = [];
    let anchorEl;
    let centerX, centerY;
    let anchorWidth, anchorY;
    let currentLine = 0;
    let currentWord = 0;  // how many words locked in current line

    // Audio/Timeline state
    let audioContext = null;
    let audioBuffer = null;
    let audioSource = null;
    let isPlaying = false;
    let playStartTime = 0;      // audioContext.currentTime when playback started
    let playOffset = 0;         // offset into audio when playback started
    let audioDuration = 0;
    let waveformData = null;    // Float32Array of waveform peaks

    // Timeline events
    let transitions = [];       // [{start, end, startBeat, endBeat, lineIndex, lockBeats, unlockBeats}, ...]
    let overdrives = [];        // [{start: seconds, end: seconds}, ...]
    let silences = [];          // [{start: seconds, end: seconds}, ...] - mutes glitch effect
    let lastTriggeredLock = -1;        // tracks which lock phases have fired
    let lastTriggeredUnlock = -1;      // tracks which unlock phases have fired

    // Animation timeout tracking (for cleanup during scrub)
    let animationTimeouts = [];

    // Drag state
    let dragging = null;        // {type: 'transition'|'od-start'|'od-end'|'od-move', index: n}
    let dragStartX = 0;         // mousedown position for drag detection
    let dragStartY = 0;
    const DRAG_THRESHOLD = 5;   // pixels - must move this far to count as drag
    let selectedMarker = null;  // {type: 'tr'|'od'|'seg', index: n} - enables resizing
    const MIN_BEATS_BETWEEN = 2; // minimum beats between transitions

    // Playback segment
    let playbackSegment = {
      start: 0,
      end: 0,
      startBeat: 0,
      endBeat: 0
    };

    // Segment redistribution constants
    let gapRatio = 0;            // 0-100, controls gap vs duration distribution
    const GAP_MIN = 2;           // beats - minimum gap at ratio 0
    const GAP_MAX = 20;          // beats - maximum gap at ratio 100
    const GAP_FLOOR = 0;         // beats - absolute minimum gap
    const DURATION_FLOOR = 2;    // beats - absolute minimum duration

    function getGapTarget() {
      return GAP_MIN + (gapRatio / 100) * (GAP_MAX - GAP_MIN);
    }

    // Box-Muller gaussian
    function gaussianRandom() {
      let u = 0, v = 0;
      while (u === 0) u = Math.random();
      while (v === 0) v = Math.random();
      return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
    }

    class Letter {
      constructor(char, index) {
        this.char = char;
        this.index = index;

        // Start in random orbit position
        const angle = Math.random() * Math.PI * 2;
        const radius = MARGIN_RADIUS + Math.random() * (CLOUD_RADIUS - MARGIN_RADIUS);
        this.x = centerX + Math.cos(angle) * radius;
        this.y = centerY + Math.sin(angle) * radius;

        // Initial orbital velocity (tangent to radius)
        const speed = 0.5 + Math.random() * 0.5;
        this.vx = -Math.sin(angle) * speed;
        this.vy = Math.cos(angle) * speed;

        this.ax = 0;
        this.ay = 0;

        // Target position (set when assigned to a word)
        this.targetX = null;
        this.targetY = null;
        this.isLocked = false;
        this.assignment = null;  // { lineIndex, wordIndex, charIndex }

        this.opacity = 0.15 + Math.random() * 0.15;
        this.baseOpacity = this.opacity;

        // DOM
        this.el = document.createElement('span');
        this.el.className = 'letter';
        this.el.textContent = char;
        document.getElementById('container').appendChild(this.el);
      }

      computeForces(allLetters) {
        let fx = 0, fy = 0;

        const dx = this.x - centerX;
        const dy = this.y - centerY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (this.isLocked && this.targetX !== null) {
          // Pull to target
          const tdx = this.targetX - this.x;
          const tdy = this.targetY - this.y;
          fx += tdx * WELL_STRENGTH;
          fy += tdy * WELL_STRENGTH;
        } else {
          // Orbital dynamics

          // 1. Margin repulsion - push away if too close to center
          if (dist < MARGIN_RADIUS && dist > 0) {
            const pushStrength = MARGIN_FORCE * (1 - dist / MARGIN_RADIUS);
            fx += (dx / dist) * pushStrength;
            fy += (dy / dist) * pushStrength;
          }

          // 2. Cloud radius pull - gentle attraction to preferred orbit
          if (dist > 0) {
            const radiusDiff = CLOUD_RADIUS - dist;
            fx += (dx / dist) * radiusDiff * CLOUD_PULL;
            fy += (dy / dist) * radiusDiff * CLOUD_PULL;

            // Slight outward pull in finale
            if (finaleMode) {
              fx += (dx / dist) * 0.003;
              fy += (dy / dist) * 0.003;
            }
          }

          // 3. Orbital force - perpendicular to radius
          if (dist > MARGIN_RADIUS * 0.5) {
            const tangentX = -dy / dist;
            const tangentY = dx / dist;
            fx += tangentX * ORBITAL_STRENGTH * dist;
            fy += tangentY * ORBITAL_STRENGTH * dist;
          }
        }

        // 4. Inter-letter repulsion (none between locked letters, but unlocked can push through)
        for (const other of allLetters) {
          if (other === this) continue;
          // Skip if both are locked - no mutual repulsion within locked text
          if (this.isLocked && other.isLocked) continue;

          const ox = this.x - other.x;
          const oy = this.y - other.y;
          const odist = Math.sqrt(ox * ox + oy * oy);

          if (odist < REPULSION_RANGE && odist > 1) {
            const force = REPULSION_STRENGTH / (odist * odist);
            fx += (ox / odist) * force;
            fy += (oy / odist) * force;
          }
        }

        // Damping
        fx -= DAMPING * this.vx;
        fy -= DAMPING * this.vy;

        // Thermal noise (reduced when locked)
        const temp = this.isLocked ? TEMPERATURE * 0.08 : TEMPERATURE;
        const noiseStrength = Math.sqrt(2 * DAMPING * temp);
        fx += noiseStrength * gaussianRandom();
        fy += noiseStrength * gaussianRandom();

        return { fx, fy };
      }

      verletStep1() {
        this.x += this.vx * DT + 0.5 * this.ax * DT * DT;
        this.y += this.vy * DT + 0.5 * this.ay * DT * DT;
        this.vx += 0.5 * this.ax * DT;
        this.vy += 0.5 * this.ay * DT;
      }

      verletStep2(allLetters) {
        const { fx, fy } = this.computeForces(allLetters);
        this.ax = fx;
        this.ay = fy;
        this.vx += 0.5 * this.ax * DT;
        this.vy += 0.5 * this.ay * DT;
      }

      updateVisuals() {
        if (this.isLocked && this.targetX !== null) {
          const dx = this.x - this.targetX;
          const dy = this.y - this.targetY;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const distNorm = Math.min(1, dist / 40);
          this.opacity = this.baseOpacity + (1 - distNorm) * (1 - this.baseOpacity);
        } else {
          this.opacity = this.baseOpacity;
        }
      }

      render(time) {
        let rx = this.x;
        let ry = this.y;
        let opacity = this.opacity;

        // Add vibration for unlocked letters
        if (!this.isLocked) {
          const phase = (time / beatMs) * Math.PI * 2 + this.index * 0.7;
          rx += Math.sin(phase) * VIBRATION_AMPLITUDE;
          ry += Math.cos(phase * 1.3) * VIBRATION_AMPLITUDE * 0.7;
        }

        // Apply glitch effects
        if (glitchActive && glitchLetters.includes(this.index)) {
          const glitchProgress = (time - glitchStartTime) / glitchDuration;
          if (glitchProgress < 1) {
            const intensity = Math.sin(glitchProgress * Math.PI);  // peaks in middle
            const mult = overdrive ? overdriveMultiplier : 1;

            // Position jump
            rx += (Math.random() - 0.5) * 20 * glitchPosStrength * intensity * mult;
            ry += (Math.random() - 0.5) * 10 * glitchPosStrength * intensity * mult;

            // Opacity flash
            opacity = Math.min(1, opacity + (Math.random() * 0.8) * glitchOpacityStrength * intensity * mult);

            // Horizontal tear (shift letters near tear line)
            const distFromTear = Math.abs(this.y - glitchTearY);
            if (distFromTear < 30) {
              const tearIntensity = (1 - distFromTear / 30) * intensity;
              rx += (Math.random() > 0.5 ? 1 : -1) * 15 * glitchTearStrength * tearIntensity * mult;
            }
          }
        }

        this.el.style.transform = `translate(${rx}px, ${ry}px)`;
        this.el.style.opacity = opacity;
      }

      get isSettled() {
        if (!this.isLocked || this.targetX === null) return false;
        const dx = Math.abs(this.x - this.targetX);
        const dy = Math.abs(this.y - this.targetY);
        const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
        return dx < 2 && dy < 2 && speed < 0.3;
      }
    }

    const SPACE_EXPANSION = 1.5;  // multiplier for space width

    function measureText(text) {
      const measurer = document.createElement('div');
      measurer.style.cssText = `
        position: absolute;
        visibility: hidden;
        font-family: 'ADolphin', Georgia, serif;
        font-size: 28px;
        white-space: pre;
      `;
      document.body.appendChild(measurer);

      // Measure space width
      measurer.textContent = ' ';
      const spaceWidth = measurer.getBoundingClientRect().width;
      const extraSpace = spaceWidth * (SPACE_EXPANSION - 1);

      const positions = [];
      let spaceCount = 0;
      for (let i = 0; i < text.length; i++) {
        measurer.textContent = text.substring(0, i);
        const x = measurer.getBoundingClientRect().width + spaceCount * extraSpace;
        positions.push({ char: text[i], x });
        if (text[i] === ' ') spaceCount++;
      }

      measurer.textContent = text;
      const totalWidth = measurer.getBoundingClientRect().width + spaceCount * extraSpace;

      document.body.removeChild(measurer);
      return { positions, totalWidth };
    }

    function assignLettersToLine(lineIndex) {
      // Release all letters
      letters.forEach(l => {
        l.isLocked = false;
        l.targetX = null;
        l.targetY = null;
        l.assignment = null;
      });

      currentWord = 0;
    }

    function lockWord(wordIndex) {
      const line = LINES[currentLine];
      if (wordIndex >= line.words.length) return;

      // Build the text up to and including this word
      const wordsToShow = line.words.slice(0, wordIndex + 1);
      const textToShow = wordsToShow.join(' ');

      // Measure positions relative to anchor
      const { positions, totalWidth } = measureText(textToShow);

      // Start position: centered for finale (based on full line), after Strach otherwise
      let startX;
      if (line.isFinale) {
        // Measure full line for proper centering
        const fullText = line.words.join(' ');
        const { totalWidth: fullWidth } = measureText(fullText);
        startX = centerX - fullWidth / 2;
      } else {
        startX = centerX + anchorWidth / 2 + 8;
      }
      const lineY = anchorY;

      // Find letters for this word
      const word = line.words[wordIndex];
      const wordStartInText = wordIndex === 0 ? 0 :
        line.words.slice(0, wordIndex).join(' ').length + 1;

      for (let i = 0; i < word.length; i++) {
        const char = word[i];
        const posIndex = wordStartInText + i;
        const targetX = startX + positions[posIndex].x;
        const targetY = lineY;

        // Find an available letter with this char
        const letter = letters.find(l =>
          l.char === char && !l.isLocked
        );

        if (letter) {
          letter.isLocked = true;
          letter.targetX = targetX;
          letter.targetY = targetY;
          letter.assignment = { lineIndex: currentLine, wordIndex: wordIndex, charIndex: i };
        }
      }
    }

    // Group words for beat-synced animation (short words 1-2 chars group with next)
    function getWordGroups(words) {
      const groups = [];
      let i = 0;
      while (i < words.length) {
        const group = [i];
        // If this word is short (1-2 chars) and there's a next word, group them
        while (words[i] && words[i].length <= 2 && i + 1 < words.length) {
          i++;
          group.push(i);
        }
        groups.push(group);
        i++;
      }
      return groups;
    }

    // Calculate transition duration in beats for a line
    // Lock: 1 beat per word group (appearing)
    // Unlock: 8 letters per beat (disappearing)
    function getLineDuration(lineIndex) {
      const line = LINES[lineIndex];
      const groups = getWordGroups(line.words);
      const lockBeats = groups.length;

      // Count total letters (excluding spaces)
      const totalLetters = line.words.join('').length;
      const unlockBeats = Math.ceil(totalLetters / 8);

      return {
        lockBeats,
        unlockBeats,
        totalBeats: lockBeats + unlockBeats
      };
    }

    function clearAnimationTimeouts() {
      animationTimeouts.forEach(id => clearTimeout(id));
      animationTimeouts = [];
    }

    function lockAllWords() {
      const line = LINES[currentLine];
      const groups = getWordGroups(line.words);

      // Schedule each group on a beat, starting from NEXT beat
      const startTime = performance.now();
      const currentBeat = getBeat(startTime);

      groups.forEach((group, beatIndex) => {
        const targetBeat = currentBeat + 1 + beatIndex;  // +1 to wait for next beat
        const targetTime = beatOffset + (targetBeat * beatMs);
        const delay = Math.max(0, targetTime - startTime);

        const timeoutId = setTimeout(() => {
          group.forEach(wordIndex => lockWord(wordIndex));
        }, delay);
        animationTimeouts.push(timeoutId);
      });

      currentWord = line.words.length;
    }

    function unlockLetter(letter) {
      letter.isLocked = false;
      letter.targetX = null;
      letter.targetY = null;
      letter.assignment = null;
    }

    function unlockWordsOnBeat(lineIndex, callback) {
      const line = LINES[lineIndex];
      if (!line) return 0;

      // Get all locked letters for this line, sorted back to front
      const lockedLetters = letters
        .filter(l => l.assignment && l.assignment.lineIndex === lineIndex)
        .sort((a, b) => {
          // Sort by word index (descending), then char index (descending)
          if (b.assignment.wordIndex !== a.assignment.wordIndex) {
            return b.assignment.wordIndex - a.assignment.wordIndex;
          }
          return b.assignment.charIndex - a.assignment.charIndex;
        });

      if (lockedLetters.length === 0) {
        if (callback) callback();
        return 0;
      }

      const startTime = performance.now();
      // Wait for next beat
      const currentBeat = getBeat(startTime);
      const nextBeatTime = beatOffset + ((currentBeat + 1) * beatMs);
      const timeToNextBeat = nextBeatTime - startTime;

      // 8 letters per beat
      const lettersPerBeat = 8;
      const msPerLetter = beatMs / lettersPerBeat;

      lockedLetters.forEach((letter, i) => {
        const delay = timeToNextBeat + (i * msPerLetter);
        const timeoutId = setTimeout(() => unlockLetter(letter), delay);
        animationTimeouts.push(timeoutId);
      });

      // Callback after all letters done
      const totalTime = timeToNextBeat + (lockedLetters.length * msPerLetter);
      // Round up to next beat for callback
      const totalBeats = Math.ceil(lockedLetters.length / lettersPerBeat);
      if (callback) {
        const callbackTime = timeToNextBeat + (totalBeats * beatMs);
        const timeoutId = setTimeout(callback, callbackTime);
        animationTimeouts.push(timeoutId);
      }

      return totalBeats;
    }

    function dissolveStrach() {
      // Create letters for "Strach" and add to cloud
      const strachChars = 'Strach';
      for (const char of strachChars) {
        const letter = new Letter(char, letters.length);
        letter.x = centerX + (Math.random() - 0.5) * 40;
        letter.y = anchorY + (Math.random() - 0.5) * 20;
        letter.opacity = 1;
        letter.baseOpacity = 0.15 + Math.random() * 0.15;
        letters.push(letter);
      }

      // Fade out anchor
      document.getElementById('anchor').style.transition = 'opacity 0.3s';
      document.getElementById('anchor').style.opacity = '0';
      finaleMode = true;
    }

    function restoreStrach() {
      // Fade anchor back in
      document.getElementById('anchor').style.transition = 'opacity 0.3s';
      document.getElementById('anchor').style.opacity = '1';
      finaleMode = false;
    }

    function transitionToNextLine() {
      const prevLineIndex = currentLine;

      currentLine++;
      if (currentLine >= LINES.length) {
        // Past the end, stay on last line
        currentLine = LINES.length - 1;
        return;
      }

      // Beat-synced unlock back to front
      const callback = LINES[currentLine].isFinale ? dissolveStrach : null;
      unlockWordsOnBeat(prevLineIndex, callback);

      currentWord = 0;
    }

    let finaleMode = false;  // when true, unlocked letters drift outward

    function advance() {
      const line = LINES[currentLine];

      if (currentWord < line.words.length) {
        // Lock all words with stagger
        lockAllWords();
      } else {
        // All words locked, go to next line
        transitionToNextLine();
      }

      updateDebug();
      updateLineNav();
    }

    function goBack() {
      if (currentLine === 0 && currentWord === 0) return;

      // If we have words locked on current line, just unlock them (beat-synced)
      if (currentWord > 0) {
        unlockWordsOnBeat(currentLine, null);
        currentWord = 0;
        updateDebug();
        updateLineNav();
        return;
      }

      // If on finale line, restore Strach
      if (LINES[currentLine].isFinale) {
        restoreStrach();
      }

      // Release current line letters immediately
      letters.forEach(l => {
        l.isLocked = false;
        l.targetX = null;
        l.targetY = null;
        l.assignment = null;
      });

      currentLine--;
      currentWord = 0;

      updateDebug();
      updateLineNav();
    }

    function goToLine(targetLine) {
      if (targetLine < 0 || targetLine >= LINES.length) return;

      // Handle Strach visibility
      const wasFinale = LINES[currentLine].isFinale;
      const willBeFinale = LINES[targetLine].isFinale;

      if (!wasFinale && willBeFinale) {
        dissolveStrach();
      } else if (wasFinale && !willBeFinale) {
        restoreStrach();
      }

      // Release all letters
      letters.forEach(l => {
        l.isLocked = false;
        l.targetX = null;
        l.targetY = null;
        l.assignment = null;
      });

      currentLine = targetLine;
      currentWord = 0;

      updateDebug();
      updateLineNav();
    }

    function updateLineNav() {
      const items = document.querySelectorAll('.line-nav-item');
      items.forEach((item, i) => {
        item.classList.toggle('active', i === currentLine);
      });
    }

    function buildLineNav() {
      const nav = document.getElementById('lineNav');
      // Clear existing items
      nav.innerHTML = '';

      LINES.forEach((line, i) => {
        const item = document.createElement('div');
        item.className = 'line-nav-item';
        item.textContent = (i + 1).toString().padStart(2, '0');
        item.addEventListener('click', () => goToLine(i));
        nav.appendChild(item);
      });
      // Add finale
      const finaleItem = document.createElement('div');
      finaleItem.className = 'line-nav-item';
      finaleItem.textContent = '••';
      finaleItem.addEventListener('click', () => goToLine(LINES.length - 1));
      nav.appendChild(finaleItem);
    }

    function updateDebug() {
      const line = LINES[currentLine];
      document.getElementById('debug').textContent =
        `line: ${currentLine} | word: ${currentWord}/${line ? line.words.length : 0}`;
    }

    function getBeat(time) {
      return Math.floor((time - beatOffset) / beatMs);
    }

    function checkGlitch(time) {
      const currentBeat = getBeat(time);

      // Check for new beat
      if (currentBeat !== lastBeat) {
        lastBeat = currentBeat;

        // Random chance to trigger glitch on this beat (unless muted by silence region)
        if (!activeSilence && Math.random() < glitchFreq) {
          glitchActive = true;
          glitchStartTime = time;

          // Select random subset of letters to affect
          glitchLetters = letters
            .filter(() => Math.random() < 0.4)
            .map(l => l.index);

          // Random tear line position
          glitchTearY = centerY + (Math.random() - 0.5) * 200;
        }
      }

      // End glitch after duration (or immediately if silence region active)
      if (glitchActive && (activeSilence || time - glitchStartTime > glitchDuration)) {
        glitchActive = false;
      }
    }

    function animate(time) {
      checkGlitch(time);

      letters.forEach(l => l.verletStep1());
      letters.forEach(l => l.verletStep2(letters));
      letters.forEach(l => {
        l.updateVisuals();
        l.render(time);
      });

      requestAnimationFrame(animate);
    }

    function init() {
      centerX = window.innerWidth / 2;
      centerY = window.innerHeight / 2;

      // Position anchor using transform (same as letters)
      anchorEl = document.getElementById('anchor');
      const anchorRect = anchorEl.getBoundingClientRect();
      anchorWidth = anchorRect.width;
      const anchorX = centerX - anchorWidth / 2;
      anchorY = centerY - anchorRect.height / 2;
      anchorEl.style.transform = `translate(${anchorX}px, ${anchorY}px)`;

      // Create letter pool
      const pool = buildPool();
      pool.forEach((char, i) => {
        const letter = new Letter(char, i);
        letters.push(letter);
      });

      buildLineNav();
      updateLineNav();
      updateDebug();
      setupLangSwitch();
      requestAnimationFrame(animate);
    }

    function switchLanguage(lang) {
      if (lang === currentLang) return;

      currentLang = lang;
      LINES = parseLines(lang);

      // Update anchor text
      const config = LANG_CONFIG[lang];
      anchorEl.textContent = config.anchor;

      // Reposition anchor (width may change)
      const anchorRect = anchorEl.getBoundingClientRect();
      anchorWidth = anchorRect.width;
      const anchorX = centerX - anchorWidth / 2;
      anchorEl.style.transform = `translate(${anchorX}px, ${anchorY}px)`;

      // Clear any pending animation timeouts
      clearAnimationTimeouts();

      // Clear existing letters
      letters.forEach(l => l.el.remove());
      letters = [];

      // Rebuild letter pool
      const pool = buildPool();
      pool.forEach((char, i) => {
        const letter = new Letter(char, i);
        letters.push(letter);
      });

      // Reset animation state
      currentLine = 0;
      currentWord = 0;
      lastTriggeredLock = -1;
      lastTriggeredUnlock = -1;
      if (finaleMode) restoreStrach();

      // Rebuild line nav (clears and rebuilds)
      buildLineNav();
      updateLineNav();
      updateDebug();

      // Update button states
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      // Reinitialize transitions for new line count/durations
      if (audioDuration > 0) {
        initTimelineEvents();
        redistributeMarkers();
        drawTimeline();
        saveState();
      }
    }

    function setupLangSwitch() {
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          switchLanguage(btn.dataset.lang);
        });
      });
    }

    // Input handlers
    document.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowRight' || e.code === 'ArrowDown') {
        e.preventDefault();
        advance();
      } else if (e.code === 'ArrowLeft' || e.code === 'ArrowUp') {
        e.preventDefault();
        goBack();
      } else if (e.code === 'Space') {
        e.preventDefault();
        spacebarOverdrive = true;
        overdrive = activeOverdrive || spacebarOverdrive;
      } else if (e.code === 'Enter') {
        e.preventDefault();
        // Sync beat - reset beat counter to start of current time
        beatOffset = performance.now();
        lastBeat = -1;
      }
    });

    document.addEventListener('keyup', (e) => {
      if (e.code === 'Space') {
        spacebarOverdrive = false;
        overdrive = activeOverdrive || spacebarOverdrive;
      }
    });

    // ============ AUDIO/TIMELINE ============

    async function initAudio() {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();

      try {
        const response = await fetch('alle-werden-alt.mp3');
        const arrayBuffer = await response.arrayBuffer();
        audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
        audioDuration = audioBuffer.duration;

        // Extract waveform data for visualization
        extractWaveform();

        // Initialize timeline events
        initTimelineEvents();

        // Load saved state or redistribute fresh
        const saved = loadState();
        if (saved) {
          applyLoadedState(saved);
        } else {
          redistributeMarkers();
        }

        drawTimeline();

        console.log(`Audio loaded: ${audioDuration.toFixed(1)}s`);
      } catch (err) {
        console.error('Failed to load audio:', err);
      }
    }

    function extractWaveform() {
      const rawData = audioBuffer.getChannelData(0);
      const samples = 1000;  // number of bars in waveform
      const blockSize = Math.floor(rawData.length / samples);
      waveformData = new Float32Array(samples);

      for (let i = 0; i < samples; i++) {
        let sum = 0;
        for (let j = 0; j < blockSize; j++) {
          sum += Math.abs(rawData[i * blockSize + j]);
        }
        waveformData[i] = sum / blockSize;
      }

      // Normalize
      const max = Math.max(...waveformData);
      for (let i = 0; i < waveformData.length; i++) {
        waveformData[i] /= max;
      }
    }

    // Beat helpers
    function getBeatInterval() {
      return 60 / bpm;
    }

    function snapToBeat(time) {
      const beatInterval = getBeatInterval();
      const beatsSinceOffset = Math.round((time - bpmOffset) / beatInterval);
      return bpmOffset + beatsSinceOffset * beatInterval;
    }

    function timeToBeat(time) {
      return Math.round((time - bpmOffset) / getBeatInterval());
    }

    function beatToTime(beat) {
      return bpmOffset + beat * getBeatInterval();
    }

    // Recalculate all times from beat positions (after BPM/offset change)
    function recalculateTimesFromBeats() {
      // Segment
      playbackSegment.start = beatToTime(playbackSegment.startBeat);
      playbackSegment.end = beatToTime(playbackSegment.endBeat);

      // Transitions
      for (const tr of transitions) {
        tr.start = beatToTime(tr.startBeat);
        tr.end = beatToTime(tr.endBeat);
      }

      // Overdrives
      for (const od of overdrives) {
        od.start = beatToTime(od.startBeat);
        od.end = beatToTime(od.endBeat);
      }
    }

    // ============ PERSISTENCE ============
    const STORAGE_KEY = 'strach-timeline-v1';

    function saveState() {
      const state = {
        bpm,
        bpmOffset,
        gapRatio,
        currentLang,
        playbackSegment: {
          startBeat: playbackSegment.startBeat,
          endBeat: playbackSegment.endBeat
        },
        transitions: transitions.map(tr => ({
          startBeat: tr.startBeat,
          endBeat: tr.endBeat
        })),
        overdrives: overdrives.map(od => ({
          startBeat: od.startBeat,
          endBeat: od.endBeat
        })),
        silences: silences.map(sil => ({
          startBeat: sil.startBeat,
          endBeat: sil.endBeat
        }))
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (e) {
        console.warn('Failed to load saved state:', e);
        return null;
      }
    }

    function applyLoadedState(saved) {
      // Apply BPM settings
      bpm = saved.bpm || 153;
      bpmOffset = saved.bpmOffset || 0;
      gapRatio = saved.gapRatio || 0;
      beatMs = 60000 / bpm;

      // Update UI
      document.getElementById('bpmInput').value = bpm;
      document.getElementById('offsetInput').value = bpmOffset.toFixed(2);
      document.getElementById('gapSlider').value = gapRatio;

      // Apply language if different
      if (saved.currentLang && saved.currentLang !== currentLang) {
        switchLanguage(saved.currentLang);
      }

      // Apply playback segment
      if (saved.playbackSegment) {
        playbackSegment.startBeat = saved.playbackSegment.startBeat;
        playbackSegment.endBeat = saved.playbackSegment.endBeat;
        playbackSegment.start = beatToTime(playbackSegment.startBeat);
        playbackSegment.end = beatToTime(playbackSegment.endBeat);
      }

      // Apply transitions (match by index, preserve lockBeats/unlockBeats)
      if (saved.transitions && saved.transitions.length === transitions.length) {
        for (let i = 0; i < transitions.length; i++) {
          transitions[i].startBeat = saved.transitions[i].startBeat;
          transitions[i].endBeat = saved.transitions[i].endBeat;
          transitions[i].start = beatToTime(transitions[i].startBeat);
          transitions[i].end = beatToTime(transitions[i].endBeat);
        }
      }

      // Apply overdrives
      if (saved.overdrives) {
        overdrives = saved.overdrives.map(od => ({
          start: beatToTime(od.startBeat),
          end: beatToTime(od.endBeat),
          startBeat: od.startBeat,
          endBeat: od.endBeat
        }));
      }

      // Apply silences
      if (saved.silences) {
        silences = saved.silences.map(sil => ({
          start: beatToTime(sil.startBeat),
          end: beatToTime(sil.endBeat),
          startBeat: sil.startBeat,
          endBeat: sil.endBeat
        }));
      }
    }

    // Calculate minimum segment size in beats (all transitions at floor duration, no gaps)
    function calculateMinSegmentBeats() {
      const n = transitions.length;
      if (n === 0) return DURATION_FLOOR;
      return n * DURATION_FLOOR;
    }

    // Push transitions in a direction with compression at boundary
    // clickBeat: the push origin point (used for filtering if startIndex not provided)
    // delta: how much to push (positive = right, negative = left)
    // startIndex: optional index to start pushing from (for marker drag)
    function pushTransitionsWithCompression(clickBeat, delta, startIndex = null) {
      if (delta === 0) return;

      const MARGIN = 6;
      const boundaryStart = playbackSegment.startBeat + MARGIN;
      const boundaryEnd = playbackSegment.endBeat - MARGIN;

      if (delta > 0) {
        // Pushing right: affect markers from startIndex or where startBeat >= clickBeat
        const affected = [];
        for (let i = 0; i < transitions.length; i++) {
          if (startIndex !== null ? i >= startIndex : transitions[i].startBeat >= clickBeat) {
            affected.push(i);
          }
        }
        if (affected.length === 0) return;

        // Sort by position (rightmost first)
        affected.sort((a, b) => transitions[b].startBeat - transitions[a].startBeat);

        // Start from rightmost, calculate compression needed
        let overflow = 0;
        for (const idx of affected) {
          const tr = transitions[idx];
          const newEnd = tr.endBeat + delta;
          if (newEnd > boundaryEnd) {
            overflow = Math.max(overflow, newEnd - boundaryEnd);
          }
        }

        // If overflow, we need to compress
        if (overflow > 0) {
          // Calculate total compressible space in affected markers
          // Priority: gaps first, then durations
          let totalGapSpace = 0;
          let totalDurationSpace = 0;

          // Gaps between affected markers
          const sortedByPos = [...affected].sort((a, b) => transitions[a].startBeat - transitions[b].startBeat);
          for (let i = 1; i < sortedByPos.length; i++) {
            const gap = transitions[sortedByPos[i]].startBeat - transitions[sortedByPos[i-1]].endBeat;
            totalGapSpace += Math.max(0, gap - GAP_MIN);
          }

          // Duration compression (down to floor)
          for (const idx of affected) {
            const tr = transitions[idx];
            const currentDur = tr.endBeat - tr.startBeat;
            const minDur = Math.max(DURATION_FLOOR, tr.lockBeats + tr.unlockBeats);
            totalDurationSpace += currentDur - minDur;
          }

          // Apply compression
          let remainingOverflow = overflow;

          // First: compress gaps
          if (remainingOverflow > 0 && totalGapSpace > 0) {
            const gapCompression = Math.min(remainingOverflow, totalGapSpace);
            remainingOverflow -= gapCompression;
          }

          // Apply the push with compression
          // Work from leftmost to rightmost
          let pos = Math.max(boundaryStart, transitions[sortedByPos[0]].startBeat + delta - overflow + Math.min(overflow, totalGapSpace));

          for (const idx of sortedByPos) {
            const tr = transitions[idx];
            const baseDur = tr.endBeat - tr.startBeat;
            const minDur = Math.max(DURATION_FLOOR, tr.lockBeats + tr.unlockBeats);

            // Calculate duration (compress if needed)
            let dur = baseDur;
            if (remainingOverflow > 0 && totalDurationSpace > 0) {
              const myCompressible = baseDur - minDur;
              const myShare = totalDurationSpace > 0 ? (myCompressible / totalDurationSpace) * remainingOverflow : 0;
              dur = Math.max(minDur, baseDur - myShare);
            }

            tr.startBeat = Math.round(pos);
            tr.endBeat = tr.startBeat + Math.round(dur);
            tr.start = beatToTime(tr.startBeat);
            tr.end = beatToTime(tr.endBeat);

            pos = tr.endBeat + GAP_MIN;
          }
        } else {
          // No overflow, just push
          for (const idx of affected) {
            transitions[idx].startBeat += delta;
            transitions[idx].endBeat += delta;
            transitions[idx].start = beatToTime(transitions[idx].startBeat);
            transitions[idx].end = beatToTime(transitions[idx].endBeat);
          }
        }
      } else {
        // Pushing left: affect markers up to startIndex or where endBeat <= clickBeat
        const affected = [];
        for (let i = 0; i < transitions.length; i++) {
          if (startIndex !== null ? i <= startIndex : transitions[i].endBeat <= clickBeat) {
            affected.push(i);
          }
        }
        if (affected.length === 0) return;

        // Sort by position (leftmost first for compression)
        affected.sort((a, b) => transitions[a].startBeat - transitions[b].startBeat);

        // Check for underflow (going past start boundary)
        let underflow = 0;
        for (const idx of affected) {
          const tr = transitions[idx];
          const newStart = tr.startBeat + delta;
          if (newStart < boundaryStart) {
            underflow = Math.max(underflow, boundaryStart - newStart);
          }
        }

        if (underflow > 0) {
          // Calculate compressible space
          let totalGapSpace = 0;
          let totalDurationSpace = 0;

          for (let i = 1; i < affected.length; i++) {
            const gap = transitions[affected[i]].startBeat - transitions[affected[i-1]].endBeat;
            totalGapSpace += Math.max(0, gap - GAP_MIN);
          }

          for (const idx of affected) {
            const tr = transitions[idx];
            const currentDur = tr.endBeat - tr.startBeat;
            const minDur = Math.max(DURATION_FLOOR, tr.lockBeats + tr.unlockBeats);
            totalDurationSpace += currentDur - minDur;
          }

          // Apply compression from left
          let pos = boundaryStart;

          for (const idx of affected) {
            const tr = transitions[idx];
            const baseDur = tr.endBeat - tr.startBeat;
            const minDur = Math.max(DURATION_FLOOR, tr.lockBeats + tr.unlockBeats);

            let dur = baseDur;
            if (underflow > 0 && totalDurationSpace > 0) {
              const myCompressible = baseDur - minDur;
              const myShare = totalDurationSpace > 0 ? (myCompressible / totalDurationSpace) * underflow : 0;
              dur = Math.max(minDur, baseDur - myShare);
            }

            tr.startBeat = Math.round(pos);
            tr.endBeat = tr.startBeat + Math.round(dur);
            tr.start = beatToTime(tr.startBeat);
            tr.end = beatToTime(tr.endBeat);

            pos = tr.endBeat + GAP_MIN;
          }
        } else {
          // No underflow, just push
          for (const idx of affected) {
            transitions[idx].startBeat += delta;
            transitions[idx].endBeat += delta;
            transitions[idx].start = beatToTime(transitions[idx].startBeat);
            transitions[idx].end = beatToTime(transitions[idx].endBeat);
          }
        }
      }
    }

    // Redistribute markers to fill segment with 6-beat margins
    // Visible time proportional to transition length, gaps controlled by slider
    // Compression priority: gaps → visible time → gaps to 0 → durations to floor
    function redistributeMarkers() {
      const n = transitions.length;
      if (n === 0) return;

      const MARGIN = 6;  // beats margin at start and end
      const totalBeats = playbackSegment.endBeat - playbackSegment.startBeat;
      const availableBeats = totalBeats - (2 * MARGIN);

      if (availableBeats <= 0) return;

      // Calculate base durations (lock + unlock, no visible)
      const baseDurations = transitions.map(tr => tr.lockBeats + tr.unlockBeats);
      const floorDurations = baseDurations.map(d => Math.max(DURATION_FLOOR, d));
      const sumBase = baseDurations.reduce((a, b) => a + b, 0);
      const sumFloor = floorDurations.reduce((a, b) => a + b, 0);

      const gapsCount = n - 1;
      const gapTarget = getGapTarget();

      // Calculate how much space we need for gaps at current slider value
      const gapSpace = gapsCount * gapTarget;

      // Remaining space after base durations and gaps = visible time pool
      let visiblePool = availableBeats - sumBase - gapSpace;
      let gap = gapTarget;
      let durations;

      if (visiblePool >= 0) {
        // Enough space: distribute visible time proportionally to base duration
        durations = baseDurations.map(base => {
          const visibleShare = sumBase > 0 ? (base / sumBase) * visiblePool : 0;
          return base + visibleShare;
        });
      } else {
        // Not enough space - need to compress
        // Priority 1: Reduce gaps to GAP_MIN (2 beats)
        const minGapSpace = gapsCount * GAP_MIN;
        visiblePool = availableBeats - sumBase - minGapSpace;

        if (visiblePool >= 0) {
          // Can fit with minimal gaps, no visible time
          durations = [...baseDurations];
          gap = gapsCount > 0 ? GAP_MIN + visiblePool / gapsCount : 0;
          visiblePool = 0;
        } else {
          // Priority 2: Remove gaps entirely
          visiblePool = availableBeats - sumBase;
          gap = 0;

          if (visiblePool >= 0) {
            // Fits with no gaps
            durations = [...baseDurations];
          } else {
            // Priority 3: Compress durations toward floor
            if (availableBeats >= sumFloor) {
              const range = sumBase - sumFloor;
              const excess = availableBeats - sumFloor;
              const t = range > 0 ? excess / range : 0;
              durations = floorDurations.map((floor, i) => {
                return floor + t * (baseDurations[i] - floor);
              });
            } else {
              // Can't fit - use floor durations
              durations = [...floorDurations];
            }
          }
        }
      }

      // Position transitions with margins
      let pos = playbackSegment.startBeat + MARGIN;
      for (let i = 0; i < n; i++) {
        const duration = Math.round(durations[i]);
        transitions[i].startBeat = Math.round(pos);
        transitions[i].endBeat = transitions[i].startBeat + duration;
        transitions[i].start = beatToTime(transitions[i].startBeat);
        transitions[i].end = beatToTime(transitions[i].endBeat);

        pos = transitions[i].endBeat + (i < n - 1 ? Math.round(gap) : 0);
      }
    }

    function initTimelineEvents() {
      const numLines = LINES.length;
      const totalBeats = timeToBeat(audioDuration);

      // Initialize playback segment to cover entire track
      playbackSegment = {
        start: 0,
        end: audioDuration,
        startBeat: 0,
        endBeat: totalBeats
      };

      // Create transitions with just their base properties
      transitions = [];
      for (let i = 0; i < numLines; i++) {
        const duration = getLineDuration(i);
        transitions.push({
          start: 0,
          end: 0,
          startBeat: 0,
          endBeat: 0,
          lineIndex: i,
          lockBeats: duration.lockBeats,
          unlockBeats: duration.unlockBeats
        });
      }

      // One test overdrive region
      const odStartBeat = 6 + Math.floor(Math.random() * (totalBeats / 4));
      const odEndBeat = odStartBeat + 4 + Math.floor(Math.random() * 8);
      overdrives = [{
        start: beatToTime(odStartBeat),
        end: beatToTime(Math.min(odEndBeat, totalBeats - 6)),
        startBeat: odStartBeat,
        endBeat: Math.min(odEndBeat, totalBeats - 6)
      }];
    }

    // Track which events have been triggered (for animation)
    let lastPlayheadTime = 0;
    let activeOverdrive = false;
    let activeSilence = false;

    function drawWaveform() {
      const canvas = document.getElementById('waveformCanvas');
      const container = document.getElementById('waveformTrack');
      const rect = container.getBoundingClientRect();

      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';

      const ctx = canvas.getContext('2d');
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

      const width = rect.width;
      const height = rect.height;
      const centerY = height / 2;

      // Clear
      ctx.fillStyle = '#0d0d0d';
      ctx.fillRect(0, 0, width, height);

      if (!waveformData) return;

      // Draw waveform
      ctx.fillStyle = '#333';
      const barWidth = width / waveformData.length;

      for (let i = 0; i < waveformData.length; i++) {
        const barHeight = waveformData[i] * (height * 0.9);
        const x = i * barWidth;
        ctx.fillRect(x, centerY - barHeight / 2, Math.max(1, barWidth - 1), barHeight);
      }

      // Draw beat grid (subtle)
      if (audioDuration > 0) {
        const beatInterval = getBeatInterval();
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 1;
        for (let t = bpmOffset; t < audioDuration; t += beatInterval) {
          const x = (t / audioDuration) * width;
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();
        }

        // Dim areas outside playback segment
        const timeToX = (t) => (t / audioDuration) * width;
        const segStartX = timeToX(playbackSegment.start);
        const segEndX = timeToX(playbackSegment.end);

        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        if (segStartX > 0) {
          ctx.fillRect(0, 0, segStartX, height);
        }
        if (segEndX < width) {
          ctx.fillRect(segEndX, 0, width - segEndX, height);
        }
      }
    }

    function drawTransitions() {
      const canvas = document.getElementById('transitionsCanvas');
      const container = document.getElementById('transitionsTrack');
      const rect = container.getBoundingClientRect();

      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';

      const ctx = canvas.getContext('2d');
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

      const width = rect.width;
      const height = rect.height;

      // Clear
      ctx.fillStyle = '#0c0c0c';
      ctx.fillRect(0, 0, width, height);

      if (!audioDuration) return;

      const timeToX = (t) => (t / audioDuration) * width;
      const currentTime = getCurrentTime();

      // Draw transition regions (like overdrive but with 3 phases)
      // Colors: cyan for lock (appearing), white for visible, orange for unlock (dropping)
      const lockColor = { r: 80, g: 180, b: 220 };    // cyan
      const visibleColor = { r: 200, g: 200, b: 200 }; // light gray
      const unlockColor = { r: 220, g: 140, b: 60 };  // orange

      for (let i = 0; i < transitions.length; i++) {
        const tr = transitions[i];
        if (!audioDuration) continue;

        const isSelected = selectedMarker && selectedMarker.type === 'tr' && selectedMarker.index === i;
        const beatInterval = getBeatInterval();

        // Calculate region bounds
        const startX = timeToX(tr.start);
        const endX = timeToX(tr.end);
        const regionWidth = endX - startX;

        // Calculate phase boundaries (in time)
        const lockEndTime = tr.start + tr.lockBeats * beatInterval;
        const unlockStartTime = tr.end - tr.unlockBeats * beatInterval;

        // Convert to X positions
        const lockEndX = timeToX(lockEndTime);
        const unlockStartX = timeToX(unlockStartTime);

        const lockWidth = lockEndX - startX;
        const visibleWidth = Math.max(0, unlockStartX - lockEndX);
        const unlockWidth = endX - unlockStartX;

        // Determine current phase
        let phase = 'before';
        let phaseProgress = 0;

        if (currentTime >= tr.end) {
          phase = 'after';
        } else if (currentTime >= unlockStartTime) {
          phase = 'unlock';
          phaseProgress = (currentTime - unlockStartTime) / (tr.end - unlockStartTime);
        } else if (currentTime >= lockEndTime) {
          phase = 'visible';
          phaseProgress = (currentTime - lockEndTime) / (unlockStartTime - lockEndTime);
        } else if (currentTime >= tr.start) {
          phase = 'lock';
          phaseProgress = (currentTime - tr.start) / (lockEndTime - tr.start);
        }

        // Draw base region (dimmed)
        // Lock section
        ctx.fillStyle = `rgba(${lockColor.r}, ${lockColor.g}, ${lockColor.b}, 0.12)`;
        ctx.fillRect(startX, 2, lockWidth, height - 4);

        // Visible section
        if (visibleWidth > 0) {
          ctx.fillStyle = `rgba(${visibleColor.r}, ${visibleColor.g}, ${visibleColor.b}, 0.08)`;
          ctx.fillRect(lockEndX, 2, visibleWidth, height - 4);
        }

        // Unlock section
        ctx.fillStyle = `rgba(${unlockColor.r}, ${unlockColor.g}, ${unlockColor.b}, 0.12)`;
        ctx.fillRect(unlockStartX, 2, unlockWidth, height - 4);

        // Draw progress highlight
        if (phase === 'lock') {
          const litWidth = lockWidth * phaseProgress;
          ctx.fillStyle = `rgba(${lockColor.r}, ${lockColor.g}, ${lockColor.b}, 0.5)`;
          ctx.fillRect(startX, 2, litWidth, height - 4);
        } else if (phase === 'visible') {
          // Lock complete
          ctx.fillStyle = `rgba(${lockColor.r}, ${lockColor.g}, ${lockColor.b}, 0.35)`;
          ctx.fillRect(startX, 2, lockWidth, height - 4);
          // Visible progress
          if (visibleWidth > 0) {
            const litWidth = visibleWidth * phaseProgress;
            ctx.fillStyle = `rgba(${visibleColor.r}, ${visibleColor.g}, ${visibleColor.b}, 0.25)`;
            ctx.fillRect(lockEndX, 2, litWidth, height - 4);
          }
        } else if (phase === 'unlock') {
          // Lock complete
          ctx.fillStyle = `rgba(${lockColor.r}, ${lockColor.g}, ${lockColor.b}, 0.35)`;
          ctx.fillRect(startX, 2, lockWidth, height - 4);
          // Visible complete
          if (visibleWidth > 0) {
            ctx.fillStyle = `rgba(${visibleColor.r}, ${visibleColor.g}, ${visibleColor.b}, 0.2)`;
            ctx.fillRect(lockEndX, 2, visibleWidth, height - 4);
          }
          // Unlock progress
          const litWidth = unlockWidth * phaseProgress;
          ctx.fillStyle = `rgba(${unlockColor.r}, ${unlockColor.g}, ${unlockColor.b}, 0.5)`;
          ctx.fillRect(unlockStartX, 2, litWidth, height - 4);
        } else if (phase === 'after') {
          // All complete - subtle glow
          ctx.fillStyle = `rgba(${lockColor.r}, ${lockColor.g}, ${lockColor.b}, 0.25)`;
          ctx.fillRect(startX, 2, lockWidth, height - 4);
          if (visibleWidth > 0) {
            ctx.fillStyle = `rgba(${visibleColor.r}, ${visibleColor.g}, ${visibleColor.b}, 0.15)`;
            ctx.fillRect(lockEndX, 2, visibleWidth, height - 4);
          }
          ctx.fillStyle = `rgba(${unlockColor.r}, ${unlockColor.g}, ${unlockColor.b}, 0.25)`;
          ctx.fillRect(unlockStartX, 2, unlockWidth, height - 4);
        }

        // Draw region border
        ctx.strokeStyle = isSelected ? '#fff' : (phase === 'before' ? '#444' : '#666');
        ctx.lineWidth = isSelected ? 2 : 1;
        ctx.strokeRect(startX + 0.5, 2.5, regionWidth - 1, height - 5);

        // Draw edge handles (only when selected for resize)
        if (isSelected) {
          const handleY = height / 2;
          const handleR = 5;

          // Start handle (cyan)
          ctx.fillStyle = `rgb(${lockColor.r}, ${lockColor.g}, ${lockColor.b})`;
          ctx.beginPath();
          ctx.arc(startX, handleY, handleR, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 1;
          ctx.stroke();

          // End handle (orange)
          ctx.fillStyle = `rgb(${unlockColor.r}, ${unlockColor.g}, ${unlockColor.b})`;
          ctx.beginPath();
          ctx.arc(endX, handleY, handleR, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 1;
          ctx.stroke();
        }

        // Duration label (line number)
        ctx.font = '9px monospace';
        ctx.fillStyle = '#888';
        ctx.fillText(`${tr.lineIndex + 1}`, startX + 3, 10);
      }
    }

    function drawOverdrives() {
      const canvas = document.getElementById('overdrivesCanvas');
      const container = document.getElementById('overdrivesTrack');
      const rect = container.getBoundingClientRect();

      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';

      const ctx = canvas.getContext('2d');
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

      const width = rect.width;
      const height = rect.height;

      // Clear
      ctx.fillStyle = '#0c0c0c';
      ctx.fillRect(0, 0, width, height);

      if (!audioDuration) return;

      const timeToX = (t) => (t / audioDuration) * width;
      const currentTime = getCurrentTime();

      // Draw overdrive regions
      for (let i = 0; i < overdrives.length; i++) {
        const od = overdrives[i];
        const x1 = timeToX(od.start);
        const x2 = timeToX(od.end);
        const isActive = currentTime >= od.start && currentTime <= od.end;
        const isSelected = selectedMarker && selectedMarker.type === 'od' && selectedMarker.index === i;

        // Pulsing effect when active
        let alpha = 0.4;
        if (isActive) {
          const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 100);
          alpha = 0.5 + pulse * 0.3;
        }

        ctx.fillStyle = `rgba(255, 80, 80, ${alpha})`;
        ctx.fillRect(x1, 2, x2 - x1, height - 4);

        // Border
        ctx.strokeStyle = isSelected ? '#fff' : (isActive ? '#ff6666' : '#663333');
        ctx.lineWidth = isSelected ? 2 : 1;
        ctx.strokeRect(x1, 2, x2 - x1, height - 4);

        // Resize handles at edges (only when selected)
        if (isSelected) {
          ctx.fillStyle = '#ff8888';
          ctx.fillRect(x1 - 3, 0, 6, height);
          ctx.fillRect(x2 - 3, 0, 6, height);
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 1;
          ctx.strokeRect(x1 - 3, 0, 6, height);
          ctx.strokeRect(x2 - 3, 0, 6, height);
        }
      }
    }

    function drawSilences() {
      const canvas = document.getElementById('silencesCanvas');

      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;

      if (!audioDuration) return;

      const timeToX = (t) => (t / audioDuration) * width;
      const currentTime = getCurrentTime();

      // Draw silence regions (blue/purple - opposite of red overdrive)
      for (let i = 0; i < silences.length; i++) {
        const sil = silences[i];

        // Resize handles at edges (only when selected)
        if (isSelected) {
          ctx.fillStyle = '#8899cc';
          ctx.fillRect(x1 - 3, 0, 6, height);
          ctx.fillRect(x2 - 3, 0, 6, height);
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 1;
          ctx.strokeRect(x1 - 3, 0, 6, height);
          ctx.strokeRect(x2 - 3, 0, 6, height);
