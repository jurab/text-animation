    function drawSegment() {
      const canvas = document.getElementById('segmentCanvas');
      const container = document.getElementById('segmentTrack');
      const rect = container.getBoundingClientRect();

      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';

      const ctx = canvas.getContext('2d');
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

      const width = rect.width;
      const height = rect.height;

      // Clear
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, width, height);

      if (!audioDuration) return;

      const timeToX = (t) => (t / audioDuration) * width;

      // Draw dimmed regions outside segment
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      const startX = timeToX(playbackSegment.start);
      const endX = timeToX(playbackSegment.end);

      // Left dimmed region
      if (startX > 0) {
        ctx.fillRect(0, 0, startX, height);
      }
      // Right dimmed region
      if (endX < width) {
        ctx.fillRect(endX, 0, width - endX, height);
      }

      // Draw segment region
      const isSelected = selectedMarker && selectedMarker.type === 'seg';
      const segWidth = endX - startX;
      ctx.fillStyle = 'rgba(100, 180, 100, 0.3)';
      ctx.fillRect(startX, 2, segWidth, height - 4);

      // Border
      ctx.strokeStyle = isSelected ? '#fff' : '#4a8a4a';
      ctx.lineWidth = isSelected ? 2 : 1;
      ctx.strokeRect(startX, 2, segWidth, height - 4);

      // Resize handles at edges (only when selected)
      if (isSelected) {
        ctx.fillStyle = '#6aaa6a';
        ctx.fillRect(startX - 3, 0, 6, height);
        ctx.fillRect(endX - 3, 0, 6, height);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.strokeRect(startX - 3, 0, 6, height);
        ctx.strokeRect(endX - 3, 0, 6, height);
      }
    }

    function updatePlayhead() {
      if (!audioDuration) return;

      const tracks = document.getElementById('timelineTracks');
      const waveformTrack = document.getElementById('waveformTrack');
      const playhead = document.getElementById('playheadLine');
      const tracksRect = tracks.getBoundingClientRect();
      const trackRect = waveformTrack.getBoundingClientRect();
      const currentTime = getCurrentTime();

      // Position relative to track content (accounting for padding)
      const trackLeft = trackRect.left - tracksRect.left;
      const x = trackLeft + (currentTime / audioDuration) * trackRect.width;

      playhead.style.left = x + 'px';

      // Check for overdrive state from timeline regions
      activeOverdrive = overdrives.some(od => currentTime >= od.start && currentTime <= od.end);
      // Check for silence state (mutes glitch)
      activeSilence = silences.some(sil => currentTime >= sil.start && currentTime <= sil.end);
      // Combine timeline overdrive with spacebar overdrive
      overdrive = activeOverdrive || spacebarOverdrive;
    }

    function drawTimeline() {
      drawWaveform();
      drawTransitions();
      drawOverdrives();
      drawSilences();
      drawSegment();
      updatePlayhead();
      updateSegmentDuration();
    }

    function getCurrentTime() {
      if (!audioContext) return 0;
      if (isPlaying) {
        return playOffset + (audioContext.currentTime - playStartTime);
      }
      return playOffset;
    }

    function updateTimeDisplay() {
      const time = getCurrentTime();
      const mins = Math.floor(time / 60);
      const secs = Math.floor(time % 60);
      document.getElementById('timeDisplay').textContent =
        `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function updateSegmentDuration() {
      const duration = playbackSegment.end - playbackSegment.start;
      const mins = Math.floor(duration / 60);
      const secs = Math.floor(duration % 60);
      document.getElementById('segmentDuration').textContent =
        `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    let stoppingManually = false;  // flag to distinguish manual stop from natural end

    function play() {
      if (!audioBuffer || isPlaying) return;

      // Deselect any selected marker on play
      if (selectedMarker) {
        selectedMarker = null;
        drawTimeline();
      }

      // Resume context if suspended (autoplay policy)
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }

      // Ensure playOffset is within segment bounds
      if (playOffset < playbackSegment.start || playOffset >= playbackSegment.end) {
        playOffset = playbackSegment.start;
      }

      audioSource = audioContext.createBufferSource();
      audioSource.buffer = audioBuffer;
      audioSource.connect(audioContext.destination);

      audioSource.onended = () => {
        if (stoppingManually) {
          stoppingManually = false;
          return;
        }
        // Natural end of playback
        isPlaying = false;
        playOffset = playbackSegment.start;  // Reset to segment start
        document.getElementById('playBtn').textContent = '▶';
      };

      playStartTime = audioContext.currentTime;
      audioSource.start(0, playOffset);
      isPlaying = true;
      document.getElementById('playBtn').textContent = '❚❚';
    }

    function pause() {
      if (!isPlaying) return;

      playOffset = getCurrentTime();
      stoppingManually = true;
      audioSource.stop();
      audioSource = null;
      isPlaying = false;
      document.getElementById('playBtn').textContent = '▶';
    }

    function togglePlayPause() {
      if (isPlaying) {
        pause();
      } else {
        play();
      }
    }

    function seekTo(time) {
      const wasPlaying = isPlaying;
      if (wasPlaying) {
        pause();
      }
      // Constrain to segment bounds
      playOffset = Math.max(playbackSegment.start, Math.min(time, playbackSegment.end));

      // Jump animation state to match new time
      jumpToState(playOffset);

      if (wasPlaying) {
        play();
      }
      updateTimeDisplay();
      drawTimeline();
    }

    function showBeatIndicator(beat, originalBeat, x) {
      const indicator = document.getElementById('beatIndicator');
      const offset = beat - originalBeat;
      let text;
      if (offset === 0) {
        text = String(beat);
      } else if (offset > 0) {
        text = `${beat} +${offset}`;
      } else {
        text = `${beat} ${offset}`;
      }
      indicator.textContent = text;
      indicator.style.left = x + 'px';
      indicator.classList.add('visible');
    }

    function hideBeatIndicator() {
      const indicator = document.getElementById('beatIndicator');
      indicator.classList.remove('visible');
    }

    function setupTimeline() {
      const transitionsTrack = document.getElementById('transitionsTrack');
      const overdrivesTrack = document.getElementById('overdrivesTrack');
      const waveformTrack = document.getElementById('waveformTrack');
      const tracks = document.getElementById('timelineTracks');
      const playBtn = document.getElementById('playBtn');

      // BPM controls
      const bpmInput = document.getElementById('bpmInput');
      const offsetInput = document.getElementById('offsetInput');
      const tapOffsetBtn = document.getElementById('tapOffsetBtn');

      playBtn.addEventListener('click', togglePlayPause);

      // Space bar to play/pause
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && e.target === document.body) {
          e.preventDefault();
          togglePlayPause();
        }
      });

      // BPM input handler - preserve beat positions, recalculate times
      bpmInput.addEventListener('change', (e) => {
        bpm = Math.max(60, Math.min(240, parseInt(e.target.value) || 153));
        e.target.value = bpm;
        beatMs = 60000 / bpm;
        if (audioDuration) {
          recalculateTimesFromBeats();
          drawTimeline();
          saveState();
        }
      });

      // Offset input handler - preserve beat positions, recalculate times
      offsetInput.addEventListener('change', (e) => {
        bpmOffset = Math.max(0, parseFloat(e.target.value) || 0);
        e.target.value = bpmOffset.toFixed(2);
        if (audioDuration) {
          recalculateTimesFromBeats();
          drawTimeline();
          saveState();
        }
      });

      // Tap to set offset from current playhead
      tapOffsetBtn.addEventListener('click', () => {
        bpmOffset = getCurrentTime();
        offsetInput.value = bpmOffset.toFixed(2);
        if (audioDuration) {
          recalculateTimesFromBeats();
          drawTimeline();
          saveState();
        }
      });

      // Gap ratio slider - redistributes markers (intentional reset)
      const gapSlider = document.getElementById('gapSlider');
      gapSlider.addEventListener('input', (e) => {
        gapRatio = parseInt(e.target.value);
        if (audioDuration && transitions.length > 0) {
          redistributeMarkers();
          drawTimeline();
        }
      });
      // Save on release (not every input event)
      gapSlider.addEventListener('change', () => {
        if (audioDuration) saveState();
      });

      // Helper functions
      const getTimeFromX = (x, width) => (x / width) * audioDuration;
      const getXFromTime = (t, width) => (t / audioDuration) * width;

      // Hit test for transitions
      function hitTestTransitions(x, width) {
        const hitRadius = 8;
        for (let i = 0; i < transitions.length; i++) {
          const tr = transitions[i];
          const startX = getXFromTime(tr.start, width);
          const endX = getXFromTime(tr.end, width);

          // Only allow resize handles if this marker is selected
          const isSelected = selectedMarker && selectedMarker.type === 'tr' && selectedMarker.index === i;
          if (isSelected) {
            if (Math.abs(x - startX) < hitRadius) {
              return { type: 'tr-start', index: i };
            }
            if (Math.abs(x - endX) < hitRadius) {
              return { type: 'tr-end', index: i };
            }
          }
          if (x > startX - hitRadius && x < endX + hitRadius) {
            return { type: 'tr-move', index: i };
          }
        }
        return null;
      }

      // Hit test for overdrives
      function hitTestOverdrives(x, width) {
        const hitRadius = 8;
        for (let i = 0; i < overdrives.length; i++) {
          const od = overdrives[i];
          const startX = getXFromTime(od.start, width);
          const endX = getXFromTime(od.end, width);

          // Only allow resize handles if this marker is selected
          const isSelected = selectedMarker && selectedMarker.type === 'od' && selectedMarker.index === i;
          if (isSelected) {
            if (Math.abs(x - startX) < hitRadius) {
              return { type: 'od-start', index: i };
            }
            if (Math.abs(x - endX) < hitRadius) {
              return { type: 'od-end', index: i };
            }
          }
          if (x > startX - hitRadius && x < endX + hitRadius) {
            return { type: 'od-move', index: i };
          }
        }
        return null;
      }

      // Hit test for silences
      function hitTestSilences(x, width) {
        const hitRadius = 8;
        for (let i = 0; i < silences.length; i++) {
          const sil = silences[i];
          const startX = getXFromTime(sil.start, width);
          const endX = getXFromTime(sil.end, width);

          const isSelected = selectedMarker && selectedMarker.type === 'sil' && selectedMarker.index === i;
          if (isSelected) {
            if (Math.abs(x - startX) < hitRadius) {
              return { type: 'sil-start', index: i };
            }
            if (Math.abs(x - endX) < hitRadius) {
              return { type: 'sil-end', index: i };
            }
          }
          if (x > startX - hitRadius && x < endX + hitRadius) {
            return { type: 'sil-move', index: i };
          }
        }
        return null;
      }

      // Hit test for playback segment
      function hitTestSegment(x, width) {
        const hitRadius = 8;
        const startX = getXFromTime(playbackSegment.start, width);
        const endX = getXFromTime(playbackSegment.end, width);

        // Only allow resize handles if segment is selected
        const isSelected = selectedMarker && selectedMarker.type === 'seg';
        if (isSelected) {
          if (Math.abs(x - startX) < hitRadius) {
            return { type: 'seg-start' };
          }
          if (Math.abs(x - endX) < hitRadius) {
            return { type: 'seg-end' };
          }
        }
        if (x > startX - hitRadius && x < endX + hitRadius) {
          return { type: 'seg-move' };
        }
        return null;
      }

      let didDrag = false;
      const segmentTrack = document.getElementById('segmentTrack');

      // Cmd+drag = PUSH (create space in drag direction)
      // Option+drag = PULL (remove space from drag direction)
      tracks.addEventListener('mousedown', (e) => {
        if (!audioDuration) return;
        if (!e.metaKey && !e.altKey) return;

        e.preventDefault();
        const trackRect = waveformTrack.getBoundingClientRect();
        const x = e.clientX - trackRect.left;
        const clickBeat = timeToBeat(getTimeFromX(x, trackRect.width));

        dragging = {
          type: e.metaKey ? 'push' : 'pull',
          clickBeat: clickBeat,
          // Store original positions
          originalTransitions: transitions.map(tr => ({
            startBeat: tr.startBeat,
            endBeat: tr.endBeat
          })),
          originalOverdrives: overdrives.map(od => ({
            startBeat: od.startBeat,
            endBeat: od.endBeat
          })),
          originalSegment: {
            startBeat: playbackSegment.startBeat,
            endBeat: playbackSegment.endBeat
          }
        };
        tracks.style.cursor = 'ew-resize';
      });

      // Transitions track
      transitionsTrack.addEventListener('mousedown', (e) => {
        if (e.metaKey || e.altKey) return;  // Let modifier+drag bubble to tracks handler
        if (!audioDuration) return;

        const rect = transitionsTrack.getBoundingClientRect();
        const x = e.clientX - rect.left;
        didDrag = false;
        dragStartX = e.clientX; dragStartY = e.clientY;

        const hit = hitTestTransitions(x, rect.width);

        // If something is selected, deselect unless clicking resize handle of selected marker
        if (selectedMarker) {
          const isResizeHandle = hit && (hit.type === 'tr-start' || hit.type === 'tr-end');
          if (!isResizeHandle) {
            selectedMarker = null;
            drawTimeline();
            return;
          }
        }

        if (hit) {
          e.preventDefault();
          const tr = transitions[hit.index];
          if (hit.type === 'tr-move') {
            const mouseDownTime = getTimeFromX(x, rect.width);
            dragging = {
              type: 'tr-move',
              index: hit.index,
              originalStartBeat: tr.startBeat,
              originalEndBeat: tr.endBeat,
              grabOffsetBeats: timeToBeat(mouseDownTime) - tr.startBeat
            };
            transitionsTrack.style.cursor = 'grabbing';
          } else {
            dragging = {
              type: hit.type,
              index: hit.index,
              originalBeat: hit.type === 'tr-start' ? tr.startBeat : tr.endBeat
            };
            transitionsTrack.style.cursor = 'ew-resize';
          }
        }
      });

      transitionsTrack.addEventListener('mousemove', (e) => {
        if (dragging) return;
        const rect = transitionsTrack.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const hit = hitTestTransitions(x, rect.width);
        if (hit) {
          transitionsTrack.style.cursor = hit.type === 'tr-move' ? 'grab' : 'ew-resize';
        } else {
          transitionsTrack.style.cursor = 'default';
        }
      });

      // Overdrives track
      overdrivesTrack.addEventListener('mousedown', (e) => {
        if (e.metaKey || e.altKey) return;  // Let modifier+drag bubble to tracks handler
        if (!audioDuration) return;

        const rect = overdrivesTrack.getBoundingClientRect();
        const x = e.clientX - rect.left;
        didDrag = false;
        dragStartX = e.clientX; dragStartY = e.clientY;

        const hit = hitTestOverdrives(x, rect.width);

        // If something is selected, deselect unless clicking resize handle of selected marker
        if (selectedMarker) {
          const isResizeHandle = hit && (hit.type === 'od-start' || hit.type === 'od-end');
          if (!isResizeHandle) {
            selectedMarker = null;
            drawTimeline();
            didDrag = true;  // Prevent mouseup from adding new overdrive
            return;
          }
        }
        if (hit) {
          e.preventDefault();
          const od = overdrives[hit.index];
          if (hit.type === 'od-move') {
            const mouseDownTime = getTimeFromX(x, rect.width);
            dragging = {
              type: 'od-move',
              index: hit.index,
              originalStartBeat: od.startBeat,
              originalEndBeat: od.endBeat,
              grabOffsetBeats: timeToBeat(mouseDownTime) - od.startBeat
            };
            overdrivesTrack.style.cursor = 'grabbing';
          } else {
            dragging = {
              type: hit.type,
              index: hit.index,
              originalBeat: hit.type === 'od-start' ? od.startBeat : od.endBeat
            };
            overdrivesTrack.style.cursor = 'ew-resize';
          }
        }
      });

      overdrivesTrack.addEventListener('mousemove', (e) => {
        if (dragging) return;
        const rect = overdrivesTrack.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const hit = hitTestOverdrives(x, rect.width);
        if (hit) {
          overdrivesTrack.style.cursor = hit.type === 'od-move' ? 'grab' : 'ew-resize';
        } else {
          overdrivesTrack.style.cursor = 'crosshair';
        }
      });

      // Segment track
      segmentTrack.addEventListener('mousedown', (e) => {
        if (e.metaKey || e.altKey) return;  // Let modifier+drag bubble to tracks handler
        if (!audioDuration) return;

        const rect = segmentTrack.getBoundingClientRect();
        const x = e.clientX - rect.left;
        didDrag = false;
        dragStartX = e.clientX; dragStartY = e.clientY;

        const hit = hitTestSegment(x, rect.width);

        // If something is selected, deselect unless clicking resize handle of selected marker
        if (selectedMarker) {
          const isResizeHandle = hit && (hit.type === 'seg-start' || hit.type === 'seg-end');
          if (!isResizeHandle) {
            selectedMarker = null;
            drawTimeline();
            return;
          }
        }
        if (hit) {
          e.preventDefault();
          if (hit.type === 'seg-move') {
            const mouseDownTime = getTimeFromX(x, rect.width);
            dragging = {
              type: 'seg-move',
              originalStartBeat: playbackSegment.startBeat,
              originalEndBeat: playbackSegment.endBeat,
              grabOffsetBeats: timeToBeat(mouseDownTime) - playbackSegment.startBeat
            };
            segmentTrack.style.cursor = 'grabbing';
          } else {
            dragging = {
              type: hit.type,
              originalBeat: hit.type === 'seg-start' ? playbackSegment.startBeat : playbackSegment.endBeat
            };
            segmentTrack.style.cursor = 'ew-resize';
          }
        }
      });

      segmentTrack.addEventListener('mousemove', (e) => {
        if (dragging) return;
        const rect = segmentTrack.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const hit = hitTestSegment(x, rect.width);
        if (hit) {
          segmentTrack.style.cursor = hit.type === 'seg-move' ? 'grab' : 'ew-resize';
        } else {
          segmentTrack.style.cursor = 'default';
        }
      });

      // Waveform track - seeking and scrubbing
      let scrubbingWaveform = false;

      waveformTrack.addEventListener('mousedown', (e) => {
        if (!audioDuration) return;
        e.preventDefault();
        scrubbingWaveform = true;
        waveformTrack.style.cursor = 'grabbing';

        // Deselect any marker when clicking waveform
        if (selectedMarker) {
          selectedMarker = null;
          drawTimeline();
        }

        const rect = waveformTrack.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const time = getTimeFromX(x, rect.width);
        seekTo(time);
      });

      window.addEventListener('mousemove', (e) => {
        if (!scrubbingWaveform) return;

        const rect = waveformTrack.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const time = Math.max(0, Math.min(audioDuration, getTimeFromX(x, rect.width)));
        seekTo(time);
      });

      window.addEventListener('mouseup', () => {
        if (scrubbingWaveform) {
          scrubbingWaveform = false;
          waveformTrack.style.cursor = '';
        }
      });

      // Overdrives track - click empty space to add new overdrive
      overdrivesTrack.addEventListener('mouseup', (e) => {
        if (!didDrag && !dragging && audioDuration) {
          const rect = overdrivesTrack.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const time = getTimeFromX(x, rect.width);

          // Check if click was on existing overdrive (don't add new one)
          const hit = hitTestOverdrives(x, rect.width);
          if (!hit) {
            // Add new 4-beat overdrive centered on click position
            const clickBeat = timeToBeat(time);
            const startBeat = Math.max(0, clickBeat - 2);
            const endBeat = startBeat + 4;

            overdrives.push({
              start: beatToTime(startBeat),
              end: beatToTime(endBeat),
              startBeat: startBeat,
              endBeat: endBeat
            });

            drawOverdrives();
            saveState();
          }
        }
      });


      // Double-click overdrive to remove it
      overdrivesTrack.addEventListener('dblclick', (e) => {
        if (!audioDuration) return;
        const rect = overdrivesTrack.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const hit = hitTestOverdrives(x, rect.width);
        if (hit) {
          overdrives.splice(hit.index, 1);
          // Clear selection if removed marker was selected
          if (selectedMarker && selectedMarker.type === 'od' && selectedMarker.index === hit.index) {
            selectedMarker = null;
          } else if (selectedMarker && selectedMarker.type === 'od' && selectedMarker.index > hit.index) {
            selectedMarker.index--;  // Adjust index after removal
          }
          drawOverdrives();
          saveState();
        }
      });

      // Silences track
      const silencesTrack = document.getElementById('silencesTrack');

      silencesTrack.addEventListener('mousedown', (e) => {
        if (e.metaKey || e.altKey) return;
        if (!audioDuration) return;

        const rect = silencesTrack.getBoundingClientRect();
        const x = e.clientX - rect.left;
        didDrag = false;
        dragStartX = e.clientX; dragStartY = e.clientY;

        const hit = hitTestSilences(x, rect.width);

        if (selectedMarker) {
          const isResizeHandle = hit && (hit.type === 'sil-start' || hit.type === 'sil-end');
          if (!isResizeHandle) {
            selectedMarker = null;
            drawTimeline();
            didDrag = true;
            return;
          }
        }
        if (hit) {
          e.preventDefault();
          const sil = silences[hit.index];
          if (hit.type === 'sil-move') {
            const mouseDownTime = getTimeFromX(x, rect.width);
            dragging = {
              type: 'sil-move',
              index: hit.index,
              originalStartBeat: sil.startBeat,
              originalEndBeat: sil.endBeat,
              grabOffsetBeats: timeToBeat(mouseDownTime) - sil.startBeat
            };
            silencesTrack.style.cursor = 'grabbing';
          } else {
            dragging = {
              type: hit.type,
              index: hit.index,
              originalBeat: hit.type === 'sil-start' ? sil.startBeat : sil.endBeat
            };
            silencesTrack.style.cursor = 'ew-resize';
          }
        }
      });

      silencesTrack.addEventListener('mousemove', (e) => {
        if (dragging) return;
        const rect = silencesTrack.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const hit = hitTestSilences(x, rect.width);
        if (hit) {
          silencesTrack.style.cursor = hit.type === 'sil-move' ? 'grab' : 'ew-resize';
        } else {
          silencesTrack.style.cursor = 'crosshair';
        }
      });

      // Click empty space to add new silence
      silencesTrack.addEventListener('mouseup', (e) => {
        if (!didDrag && !dragging && audioDuration) {
          const rect = silencesTrack.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const time = getTimeFromX(x, rect.width);

          const hit = hitTestSilences(x, rect.width);
          if (!hit) {
            const clickBeat = timeToBeat(time);
            const startBeat = Math.max(0, clickBeat - 2);
            const endBeat = startBeat + 4;

            silences.push({
              start: beatToTime(startBeat),
              end: beatToTime(endBeat),
              startBeat: startBeat,
              endBeat: endBeat
            });

            drawSilences();
            saveState();
          }
        }
      });

      // Double-click silence to remove it
      silencesTrack.addEventListener('dblclick', (e) => {
        if (!audioDuration) return;
        const rect = silencesTrack.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const hit = hitTestSilences(x, rect.width);
        if (hit) {
          silences.splice(hit.index, 1);
          if (selectedMarker && selectedMarker.type === 'sil' && selectedMarker.index === hit.index) {
            selectedMarker = null;
          } else if (selectedMarker && selectedMarker.type === 'sil' && selectedMarker.index > hit.index) {
            selectedMarker.index--;
          }
          drawSilences();
          saveState();
        }
      });

      // Global mousemove for dragging (with beat snapping)
      window.addEventListener('mousemove', (e) => {
        if (!dragging) return;

        // Only count as drag after moving past threshold (prevents accidental drags during clicks)
        if (!didDrag) {
          const dx = e.clientX - dragStartX;
          const dy = e.clientY - dragStartY;
          if (dx * dx + dy * dy < DRAG_THRESHOLD * DRAG_THRESHOLD) return;
          didDrag = true;
        }
        const rect = tracks.getBoundingClientRect();
        const trackRect = waveformTrack.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const trackX = e.clientX - trackRect.left;
        const time = getTimeFromX(trackX, trackRect.width);
        const beat = timeToBeat(time);

        // Calculate indicator position (viewport-relative, since timeline-panel is fixed at left:0)
        const indicatorX = trackRect.left + (time / audioDuration) * trackRect.width;

        if (dragging.type === 'tr-start') {
          const tr = transitions[dragging.index];
          const idx = dragging.index;
          // Min: previous transition's end (or 0)
          const minBeat = idx > 0 ? transitions[idx - 1].endBeat + MIN_BEATS_BETWEEN : 0;
          // Max: current end minus minimum duration (lock + unlock)
          const minDuration = tr.lockBeats + tr.unlockBeats;
          const maxBeat = tr.endBeat - minDuration;
          const newBeat = Math.max(minBeat, Math.min(maxBeat, beat));
          tr.startBeat = newBeat;
          tr.start = beatToTime(newBeat);
          showBeatIndicator(newBeat, dragging.originalBeat, indicatorX);
          drawTransitions();
        } else if (dragging.type === 'tr-end') {
          const tr = transitions[dragging.index];
          const idx = dragging.index;
          // Min: start plus minimum duration
          const minDuration = tr.lockBeats + tr.unlockBeats;
          const minBeat = tr.startBeat + minDuration;
          // Max: next transition's start (or audio end)
          const maxBeat = idx < transitions.length - 1 ? transitions[idx + 1].startBeat - MIN_BEATS_BETWEEN : timeToBeat(audioDuration);
          const newBeat = Math.max(minBeat, Math.min(maxBeat, beat));
          tr.endBeat = newBeat;
          tr.end = beatToTime(newBeat);
          showBeatIndicator(newBeat, dragging.originalBeat, indicatorX);
          drawTransitions();
        } else if (dragging.type === 'tr-move') {
          const tr = transitions[dragging.index];
          const idx = dragging.index;
          const duration = dragging.originalEndBeat - dragging.originalStartBeat;
          const newStartBeat = beat - dragging.grabOffsetBeats;

          // Check if we're hitting adjacent markers
          const prevEnd = idx > 0 ? transitions[idx - 1].endBeat : playbackSegment.startBeat + 6;
          const nextStart = idx < transitions.length - 1 ? transitions[idx + 1].startBeat : playbackSegment.endBeat - 6;

          const movingRight = newStartBeat > tr.startBeat;
          const movingLeft = newStartBeat < tr.startBeat;
          const newEndBeat = newStartBeat + duration;

          // Check if we're pushing against next/previous marker
          const hitsNext = movingRight && newEndBeat >= nextStart - MIN_BEATS_BETWEEN && idx < transitions.length - 1;
          const hitsPrev = movingLeft && newStartBeat <= prevEnd + MIN_BEATS_BETWEEN && idx > 0;

          if (hitsNext) {
            // Push everything to the right with compression
            const desiredEnd = newEndBeat;
            const currentEnd = tr.endBeat;
            const delta = desiredEnd - currentEnd;

            // Push markers after this one FIRST (before moving this marker)
            if (delta > 0) {
              pushTransitionsWithCompression(0, delta, idx + 1);
            }

            // Now move this marker, but constrain to not overlap with pushed markers
            const maxEnd = idx < transitions.length - 1
              ? transitions[idx + 1].startBeat - MIN_BEATS_BETWEEN
              : playbackSegment.endBeat - 6;
            const clampedEnd = Math.min(newEndBeat, maxEnd);
            const clampedStart = clampedEnd - duration;

            tr.startBeat = clampedStart;
            tr.endBeat = clampedEnd;
            tr.start = beatToTime(tr.startBeat);
            tr.end = beatToTime(tr.endBeat);

            showBeatIndicator(clampedStart, dragging.originalStartBeat, indicatorX);
            drawTransitions();
          } else if (hitsPrev) {
            // Push everything to the left with compression
            const desiredStart = newStartBeat;
            const currentStart = tr.startBeat;
            const delta = desiredStart - currentStart; // negative since moving left

            // Push markers before this one FIRST (before moving this marker)
            if (delta < 0) {
              pushTransitionsWithCompression(0, delta, idx - 1);
            }

            // Now move this marker, but constrain to not overlap with pushed markers
            const minStart = idx > 0
              ? transitions[idx - 1].endBeat + MIN_BEATS_BETWEEN
              : playbackSegment.startBeat + 6;
            const clampedStart = Math.max(newStartBeat, minStart);
            const clampedEnd = clampedStart + duration;

            tr.startBeat = clampedStart;
            tr.endBeat = clampedEnd;
            tr.start = beatToTime(tr.startBeat);
            tr.end = beatToTime(tr.endBeat);

            showBeatIndicator(clampedStart, dragging.originalStartBeat, indicatorX);
            drawTransitions();
          } else {
            // Normal move within gaps - constrain to available space
            const minBeat = idx > 0 ? transitions[idx - 1].endBeat + MIN_BEATS_BETWEEN : playbackSegment.startBeat + 6;
            const maxBeat = idx < transitions.length - 1
              ? transitions[idx + 1].startBeat - MIN_BEATS_BETWEEN - duration
              : playbackSegment.endBeat - 6 - duration;
            const clampedStart = Math.max(minBeat, Math.min(maxBeat, newStartBeat));
            tr.startBeat = clampedStart;
            tr.endBeat = clampedStart + duration;
            tr.start = beatToTime(tr.startBeat);
            tr.end = beatToTime(tr.endBeat);
            showBeatIndicator(clampedStart, dragging.originalStartBeat, indicatorX);
            drawTransitions();
          }
        } else if (dragging.type === 'od-start') {
          const od = overdrives[dragging.index];
          const newBeat = Math.max(0, Math.min(od.endBeat - 1, beat));
          od.startBeat = newBeat;
          od.start = beatToTime(newBeat);
          showBeatIndicator(newBeat, dragging.originalBeat, indicatorX);
          drawOverdrives();
        } else if (dragging.type === 'od-end') {
          const od = overdrives[dragging.index];
          const newBeat = Math.max(od.startBeat + 1, Math.min(timeToBeat(audioDuration), beat));
          od.endBeat = newBeat;
          od.end = beatToTime(newBeat);
          showBeatIndicator(newBeat, dragging.originalBeat, indicatorX);
          drawOverdrives();
        } else if (dragging.type === 'od-move') {
          const od = overdrives[dragging.index];
          const duration = dragging.originalEndBeat - dragging.originalStartBeat;
          const newStartBeat = beat - dragging.grabOffsetBeats;
          const clampedStart = Math.max(0, Math.min(timeToBeat(audioDuration) - duration, newStartBeat));
          od.startBeat = clampedStart;
          od.endBeat = clampedStart + duration;
          od.start = beatToTime(od.startBeat);
          od.end = beatToTime(od.endBeat);
          showBeatIndicator(clampedStart, dragging.originalStartBeat, indicatorX);
          drawOverdrives();
        } else if (dragging.type === 'sil-start') {
          const sil = silences[dragging.index];
          const newBeat = Math.max(0, Math.min(sil.endBeat - 1, beat));
          sil.startBeat = newBeat;
          sil.start = beatToTime(newBeat);
          showBeatIndicator(newBeat, dragging.originalBeat, indicatorX);
          drawSilences();
        } else if (dragging.type === 'sil-end') {
          const sil = silences[dragging.index];
          const newBeat = Math.max(sil.startBeat + 1, Math.min(timeToBeat(audioDuration), beat));
          sil.endBeat = newBeat;
          sil.end = beatToTime(newBeat);
          showBeatIndicator(newBeat, dragging.originalBeat, indicatorX);
          drawSilences();
        } else if (dragging.type === 'sil-move') {
          const sil = silences[dragging.index];
          const duration = dragging.originalEndBeat - dragging.originalStartBeat;
          const newStartBeat = beat - dragging.grabOffsetBeats;
          const clampedStart = Math.max(0, Math.min(timeToBeat(audioDuration) - duration, newStartBeat));
          sil.startBeat = clampedStart;
          sil.endBeat = clampedStart + duration;
          sil.start = beatToTime(sil.startBeat);
          sil.end = beatToTime(sil.endBeat);
          showBeatIndicator(clampedStart, dragging.originalStartBeat, indicatorX);
          drawSilences();
        } else if (dragging.type === 'seg-start') {
          // Minimum segment size based on transitions
          const minSegmentBeats = calculateMinSegmentBeats();
          const maxBeat = playbackSegment.endBeat - minSegmentBeats;
          const newBeat = Math.max(0, Math.min(maxBeat, beat));
          playbackSegment.startBeat = newBeat;
          playbackSegment.start = beatToTime(newBeat);
          showBeatIndicator(newBeat, dragging.originalBeat, indicatorX);
          redistributeMarkers();
          drawTimeline();
        } else if (dragging.type === 'seg-end') {
          const minSegmentBeats = calculateMinSegmentBeats();
          const minBeat = playbackSegment.startBeat + minSegmentBeats;
          const newBeat = Math.max(minBeat, Math.min(timeToBeat(audioDuration), beat));
          playbackSegment.endBeat = newBeat;
          playbackSegment.end = beatToTime(newBeat);
          showBeatIndicator(newBeat, dragging.originalBeat, indicatorX);
          redistributeMarkers();
          drawTimeline();
        } else if (dragging.type === 'seg-move') {
          const duration = dragging.originalEndBeat - dragging.originalStartBeat;
          const newStartBeat = beat - dragging.grabOffsetBeats;
          const clampedStart = Math.max(0, Math.min(timeToBeat(audioDuration) - duration, newStartBeat));
          const delta = clampedStart - playbackSegment.startBeat;

          playbackSegment.startBeat = clampedStart;
          playbackSegment.endBeat = clampedStart + duration;
          playbackSegment.start = beatToTime(playbackSegment.startBeat);
          playbackSegment.end = beatToTime(playbackSegment.endBeat);

          // Move all transitions by the same delta
          for (const tr of transitions) {
            tr.startBeat += delta;
            tr.endBeat += delta;
            tr.start = beatToTime(tr.startBeat);
            tr.end = beatToTime(tr.endBeat);
          }

          showBeatIndicator(clampedStart, dragging.originalStartBeat, indicatorX);
          drawTimeline();
        } else if (dragging.type === 'push') {
          const delta = beat - dragging.clickBeat;
          // Reset to original positions first
          for (let i = 0; i < transitions.length; i++) {
            const orig = dragging.originalTransitions[i];
            transitions[i].startBeat = orig.startBeat;
            transitions[i].endBeat = orig.endBeat;
            transitions[i].start = beatToTime(orig.startBeat);
            transitions[i].end = beatToTime(orig.endBeat);
          }
          // Then push with compression
          pushTransitionsWithCompression(dragging.clickBeat, delta);
          showBeatIndicator(beat, dragging.clickBeat, indicatorX);
          drawTimeline();
        } else if (dragging.type === 'pull') {
          const delta = beat - dragging.clickBeat;
          const clickBeat = dragging.clickBeat;

          // Pull: items from drag direction move toward click
          for (let i = 0; i < transitions.length; i++) {
            const orig = dragging.originalTransitions[i];
            let newStart = orig.startBeat;
            let newEnd = orig.endBeat;

            if (delta > 0) {
              // Dragging right: pull items from right toward click
              if (orig.startBeat > clickBeat) newStart = Math.max(clickBeat, orig.startBeat - delta);
              if (orig.endBeat > clickBeat) newEnd = Math.max(clickBeat, orig.endBeat - delta);
            } else {
              // Dragging left: pull items from left toward click
              if (orig.startBeat < clickBeat) newStart = Math.min(clickBeat, orig.startBeat - delta);
              if (orig.endBeat < clickBeat) newEnd = Math.min(clickBeat, orig.endBeat - delta);
            }

            // Ensure minimum duration
            if (newEnd - newStart < DURATION_FLOOR) {
              if (newStart !== orig.startBeat) newStart = newEnd - DURATION_FLOOR;
              else newEnd = newStart + DURATION_FLOOR;
            }

            transitions[i].startBeat = Math.max(0, newStart);
            transitions[i].endBeat = newEnd;
            transitions[i].start = beatToTime(transitions[i].startBeat);
            transitions[i].end = beatToTime(transitions[i].endBeat);
          }

          showBeatIndicator(beat, dragging.clickBeat, indicatorX);
          drawTimeline();
        }
      });

      // Global mouseup to end dragging
      window.addEventListener('mouseup', () => {
        if (dragging) {
          // If clicked without dragging, toggle selection
          if (!didDrag) {
            const clickedType = dragging.type.startsWith('tr-') ? 'tr' :
                               dragging.type.startsWith('od-') ? 'od' :
                               dragging.type.startsWith('sil-') ? 'sil' :
                               dragging.type.startsWith('seg-') ? 'seg' : null;
            const clickedIndex = dragging.index;

            if (clickedType) {
              // Toggle selection
              if (selectedMarker && selectedMarker.type === clickedType && selectedMarker.index === clickedIndex) {
                selectedMarker = null;  // Deselect
              } else {
                selectedMarker = { type: clickedType, index: clickedIndex };
              }
              drawTimeline();
            }
          }
          // Save state if we actually dragged something
          if (didDrag) {
            saveState();
          }
          dragging = null;
          transitionsTrack.style.cursor = 'default';
          overdrivesTrack.style.cursor = 'default';
          silencesTrack.style.cursor = 'default';
          segmentTrack.style.cursor = 'default';
          tracks.style.cursor = '';
          hideBeatIndicator();
        }
        didDrag = false;
      });

      // Redraw on resize
      window.addEventListener('resize', () => {
        drawTimeline();
      });
    }

    // Timeline animation loop (updates playhead + time display)
    function animateTimeline() {
      if (isPlaying) {
        const currentTime = getCurrentTime();
        const beatInterval = getBeatInterval();

        // Stop at segment end
        if (currentTime >= playbackSegment.end) {
          pause();
          playOffset = playbackSegment.start;
          updateTimeDisplay();
          drawTimeline();
          requestAnimationFrame(animateTimeline);
          return;
        }

        // Check for lock triggers (at start time)
        for (let i = 0; i < transitions.length; i++) {
          if (i > lastTriggeredLock && currentTime >= transitions[i].start) {
            triggerLock(i);
            lastTriggeredLock = i;
          }
        }

        // Check for unlock triggers (at end - unlockDuration)
        for (let i = 0; i < transitions.length; i++) {
          const tr = transitions[i];
          const unlockStartTime = tr.end - tr.unlockBeats * beatInterval;
          if (i > lastTriggeredUnlock && currentTime >= unlockStartTime) {
            triggerUnlock(i);
            lastTriggeredUnlock = i;
          }
        }

        updateTimeDisplay();
        drawTransitions();
        drawOverdrives();
        drawSilences();
        updatePlayhead();
      }
      requestAnimationFrame(animateTimeline);
    }

    // Trigger lock phase for a transition
    function triggerLock(transitionIndex) {
      const tr = transitions[transitionIndex];
      // Lock words on this line
      if (currentWord < LINES[currentLine].words.length) {
        lockAllWords();
      }
    }

    // Trigger unlock phase for a transition
    function triggerUnlock(transitionIndex) {
      // Unlock current line and move to next
      transitionToNextLine();
    }

    // Jump to animation state for a given time (instant, no animation)
    function jumpToState(time) {
      const beatInterval = getBeatInterval();

      // Find which transition we're currently in (time falls within start..end)
      let activeTransition = -1;
      for (let i = transitions.length - 1; i >= 0; i--) {
        if (time >= transitions[i].start) {
          activeTransition = i;
          break;
        }
      }

      // Update tracking - find which locks/unlocks have fired
      lastTriggeredLock = -1;
      lastTriggeredUnlock = -1;
      for (let i = 0; i < transitions.length; i++) {
        if (time >= transitions[i].start) lastTriggeredLock = i;
        const unlockStart = transitions[i].end - transitions[i].unlockBeats * beatInterval;
        if (time >= unlockStart) lastTriggeredUnlock = i;
      }

      // If before all transitions, reset to start
      if (activeTransition < 0) {
        clearAnimationTimeouts();
        letters.forEach(l => {
          l.isLocked = false;
          l.targetX = null;
          l.targetY = null;
          l.assignment = null;
        });
        currentLine = 0;
        currentWord = 0;
        if (finaleMode) restoreStrach();
        updateDebug();
        updateLineNav();
        return;
      }

      // Determine which phase we're in
      const tr = transitions[activeTransition];
      const lockEndTime = tr.start + tr.lockBeats * beatInterval;
      const unlockStartTime = tr.end - tr.unlockBeats * beatInterval;

      if (time < lockEndTime) {
        // Lock phase - show this line locked
        const targetLine = Math.min(activeTransition, LINES.length - 1);
        jumpToLine(targetLine);
      } else if (time < unlockStartTime) {
        // Visible phase - text is visible, locked
        const targetLine = Math.min(activeTransition, LINES.length - 1);
        jumpToLine(targetLine);
      } else if (time < tr.end) {
        // Unlock phase - show cloud, preparing for next line
        jumpToCloud(activeTransition + 1);
      } else {
        // Past this transition - should be in next transition's territory
        // This case handles gaps between transitions
        jumpToCloud(activeTransition + 1);
      }
    }

    // Jump to cloud state (all letters unlocked, currentLine set but no words locked)
    function jumpToCloud(lineIndex) {
      clearAnimationTimeouts();

      const targetLine = Math.min(Math.max(0, lineIndex), LINES.length - 1);

      // Handle Strach visibility
      const wasFinale = LINES[currentLine]?.isFinale;
      const willBeFinale = LINES[targetLine]?.isFinale;

      if (!wasFinale && willBeFinale) {
        dissolveStrach();
      } else if (wasFinale && !willBeFinale) {
        restoreStrach();
      }

      // Release all letters
      letters.forEach(l => {
        l.isLocked = false;
        l.targetX = null;
        l.targetY = null;
        l.assignment = null;
      });

      currentLine = targetLine;
      currentWord = 0;

      updateDebug();
      updateLineNav();
    }

    // Instantly set animation to show a specific line (all words locked)
    function jumpToLine(targetLine) {
      // Clear any pending animation timeouts
      clearAnimationTimeouts();

      // Handle Strach visibility
      const wasFinale = LINES[currentLine]?.isFinale;
      const willBeFinale = LINES[targetLine]?.isFinale;

      if (!wasFinale && willBeFinale) {
        dissolveStrach();
      } else if (wasFinale && !willBeFinale) {
        restoreStrach();
      }

      // Release all letters first
      letters.forEach(l => {
        l.isLocked = false;
        l.targetX = null;
        l.targetY = null;
        l.assignment = null;
      });

      currentLine = targetLine;
      currentWord = 0;

      // Now lock all words on this line instantly (teleport)
      lockAllWordsInstant();

      updateDebug();
      updateLineNav();
    }

    // Lock all words on current line instantly (no animation delay)
    function lockAllWordsInstant() {
      const line = LINES[currentLine];
      for (let wordIndex = 0; wordIndex < line.words.length; wordIndex++) {
        lockWord(wordIndex);
      }
      currentWord = line.words.length;
    }

    // ============ END AUDIO/TIMELINE ============

    // Glitch control sliders
    function setupSliders() {
      const freqSlider = document.getElementById('glitchFreq');
      const posSlider = document.getElementById('glitchPos');
      const opacitySlider = document.getElementById('glitchOpacity');
      const tearSlider = document.getElementById('glitchTear');

      freqSlider.addEventListener('input', (e) => {
        glitchFreq = e.target.value / 100;
        document.getElementById('glitchFreqVal').textContent = e.target.value + '%';
      });

      posSlider.addEventListener('input', (e) => {
        glitchPosStrength = e.target.value / 100;
        document.getElementById('glitchPosVal').textContent = e.target.value;
      });

      opacitySlider.addEventListener('input', (e) => {
        glitchOpacityStrength = e.target.value / 100;
        document.getElementById('glitchOpacityVal').textContent = e.target.value;
      });

      tearSlider.addEventListener('input', (e) => {
        glitchTearStrength = e.target.value / 100;
        document.getElementById('glitchTearVal').textContent = e.target.value;
      });

      const odSlider = document.getElementById('glitchOD');
      odSlider.addEventListener('input', (e) => {
        overdriveMultiplier = parseInt(e.target.value);
        document.getElementById('glitchODVal').textContent = e.target.value + 'x';
      });
    }

    document.fonts.ready.then(() => {
      setupSliders();
      setupTimeline();
      initAudio();
      animateTimeline();
      init();
    });
  </script>
</body>
