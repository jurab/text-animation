<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="scrap-title" content="Strach">
  <title>Strach</title>
  <style>
    @font-face {
      font-family: 'ADolphin';
      src: url('../../materials/fonts/ADolphin-Roman.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      min-height: 500vh;
      background: #000;
      font-family: 'ADolphin', Georgia, serif;
      color: #e8e4d9;
      overscroll-behavior: none;
    }

    .container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    .letter {
      position: fixed;
      left: 0;
      top: 0;
      font-size: 28px;
      will-change: transform, opacity;
      pointer-events: none;
    }

    .anchor {
      position: fixed;
      left: 0;
      top: 0;
      font-size: 28px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="container" id="container"></div>
  <div class="anchor" id="anchor">Strach</div>

  <script>
    // Czech text only
    const LINES_RAW = [
      "Strach, že si pro mě přijdou",
      "Strach, že zaspim",
      "Strach, že ani neusnu",
      "Strach, že vstane minulost",
      "Strach, že odejde dnešek",
      "Strach, že mi v noci někdo zavolá",
      "Strach, že je to někdo koho neznám",
      "Strach, že ho znám",
      "Strach z úzkosti!",
      "Strach, že najdu Tvoje tělo",
      "Strach, že mi dojdou peníze",
      "Strach, že mě psychologicky profiluješ",
      "Strach, že uvidím mámu stárnout",
      "Strach, že uvidim stárnout sebe",
      "Strach, že se vzbudim a nebudeš tu",
      "Strach, že budu milovat",
      "Strach, že nebudu milovat dost",
      "Strach ze smrti",
      "Strach, že budu žít až moc dlouho",
      "Strach ze smrti",
      "Jo, to sem říkal"
    ];

    const ANCHOR_TEXT = "Strach";
    const ANCHOR_LEN = 6;

    let LINES = [];

    function parseLines() {
      const finaleIdx = LINES_RAW.length - 1;
      return LINES_RAW.map((line, i) => {
        if (i === finaleIdx) {
          const words = line.match(/[^\s]+/g) || [];
          return { full: line, rest: line, words, isFinale: true };
        }
        const rest = line.substring(ANCHOR_LEN);
        const words = rest.match(/[^\s]+/g) || [];
        return { full: line, rest, words, isFinale: false };
      });
    }

    LINES = parseLines();

    // Build character pool - count max occurrences per char across lines (excluding "Strach")
    function buildPool() {
      const maxCounts = {};
      LINES.forEach(line => {
        const counts = {};
        for (const c of line.rest) {
          if (c === ' ') continue;
          counts[c] = (counts[c] || 0) + 1;
        }
        for (const [c, count] of Object.entries(counts)) {
          maxCounts[c] = Math.max(maxCounts[c] || 0, count);
        }
      });

      const pool = [];
      for (const [char, count] of Object.entries(maxCounts)) {
        for (let i = 0; i < count; i++) {
          pool.push(char);
        }
      }
      return pool;
    }

    // Langevin physics constants
    const TEMPERATURE = 0.15;
    const DAMPING = 0.3;
    const ORBITAL_STRENGTH = 0.002;
    const MARGIN_RADIUS = 80;
    const MARGIN_FORCE = 0.3;
    const WELL_STRENGTH = 0.12;
    const CLOUD_RADIUS = 180;
    const CLOUD_PULL = 0.01;
    const REPULSION_STRENGTH = 150;
    const REPULSION_RANGE = 50;
    const DT = 1.0;

    // Vibration (using performance.now instead of audio BPM)
    const VIBRATION_BPM = 153;
    const VIBRATION_BEAT_MS = 60000 / VIBRATION_BPM;
    const VIBRATION_AMPLITUDE = 1.2;

    // Glitch state
    let glitchActive = false;
    let glitchStartTime = 0;
    let glitchDuration = 80;
    let glitchLetters = [];
    let glitchTearY = 0;

    // Glitch settings (fixed defaults, no sliders)
    let glitchFreq = 1.0;
    let glitchPosStrength = 0.5;
    let glitchOpacityStrength = 0.64;
    let glitchTearStrength = 1.0;
    let overdrive = false;
    let overdriveMultiplier = 4;

    let letters = [];
    let anchorEl;
    let centerX, centerY;
    let anchorWidth, anchorY;
    let currentLine = 0;
    let currentWord = 0;
    let finaleMode = false;

    // Scroll state
    let scrollProgress = 0;       // 0..1
    let lastScrollY = 0;
    let scrollDelta = 0;          // pixels per frame, for glitch triggering
    let lastScrollTime = 0;

    // Box-Muller gaussian
    function gaussianRandom() {
      let u = 0, v = 0;
      while (u === 0) u = Math.random();
      while (v === 0) v = Math.random();
      return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
    }

    class Letter {
      constructor(char, index) {
        this.char = char;
        this.index = index;

        const angle = Math.random() * Math.PI * 2;
        const radius = MARGIN_RADIUS + Math.random() * (CLOUD_RADIUS - MARGIN_RADIUS);
        this.x = centerX + Math.cos(angle) * radius;
        this.y = centerY + Math.sin(angle) * radius;

        const speed = 0.5 + Math.random() * 0.5;
        this.vx = -Math.sin(angle) * speed;
        this.vy = Math.cos(angle) * speed;

        this.ax = 0;
        this.ay = 0;

        this.targetX = null;
        this.targetY = null;
        this.isLocked = false;
        this.assignment = null;

        this.opacity = 0.15 + Math.random() * 0.15;
        this.baseOpacity = this.opacity;

        this.el = document.createElement('span');
        this.el.className = 'letter';
        this.el.textContent = char;
        document.getElementById('container').appendChild(this.el);
      }

      computeForces(allLetters) {
        let fx = 0, fy = 0;

        const dx = this.x - centerX;
        const dy = this.y - centerY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (this.isLocked && this.targetX !== null) {
          const tdx = this.targetX - this.x;
          const tdy = this.targetY - this.y;
          fx += tdx * WELL_STRENGTH;
          fy += tdy * WELL_STRENGTH;
        } else {
          if (dist < MARGIN_RADIUS && dist > 0) {
            const pushStrength = MARGIN_FORCE * (1 - dist / MARGIN_RADIUS);
            fx += (dx / dist) * pushStrength;
            fy += (dy / dist) * pushStrength;
          }

          if (dist > 0) {
            const radiusDiff = CLOUD_RADIUS - dist;
            fx += (dx / dist) * radiusDiff * CLOUD_PULL;
            fy += (dy / dist) * radiusDiff * CLOUD_PULL;

            if (finaleMode) {
              fx += (dx / dist) * 0.003;
              fy += (dy / dist) * 0.003;
            }
          }

          if (dist > MARGIN_RADIUS * 0.5) {
            const tangentX = -dy / dist;
            const tangentY = dx / dist;
            fx += tangentX * ORBITAL_STRENGTH * dist;
            fy += tangentY * ORBITAL_STRENGTH * dist;
          }
        }

        for (const other of allLetters) {
          if (other === this) continue;
          if (this.isLocked && other.isLocked) continue;

          const ox = this.x - other.x;
          const oy = this.y - other.y;
          const odist = Math.sqrt(ox * ox + oy * oy);

          if (odist < REPULSION_RANGE && odist > 1) {
            const force = REPULSION_STRENGTH / (odist * odist);
            fx += (ox / odist) * force;
            fy += (oy / odist) * force;
          }
        }

        fx -= DAMPING * this.vx;
        fy -= DAMPING * this.vy;

        const temp = this.isLocked ? TEMPERATURE * 0.08 : TEMPERATURE;
        const noiseStrength = Math.sqrt(2 * DAMPING * temp);
        fx += noiseStrength * gaussianRandom();
        fy += noiseStrength * gaussianRandom();

        return { fx, fy };
      }

      verletStep1() {
        this.x += this.vx * DT + 0.5 * this.ax * DT * DT;
        this.y += this.vy * DT + 0.5 * this.ay * DT * DT;
        this.vx += 0.5 * this.ax * DT;
        this.vy += 0.5 * this.ay * DT;
      }

      verletStep2(allLetters) {
        const { fx, fy } = this.computeForces(allLetters);
        this.ax = fx;
        this.ay = fy;
        this.vx += 0.5 * this.ax * DT;
        this.vy += 0.5 * this.ay * DT;
      }

      updateVisuals() {
        if (this.isLocked && this.targetX !== null) {
          const dx = this.x - this.targetX;
          const dy = this.y - this.targetY;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const distNorm = Math.min(1, dist / 40);
          this.opacity = this.baseOpacity + (1 - distNorm) * (1 - this.baseOpacity);
        } else {
          this.opacity = this.baseOpacity;
        }
      }

      render(time) {
        let rx = this.x;
        let ry = this.y;
        let opacity = this.opacity;

        // Vibration for unlocked letters (using performance.now)
        if (!this.isLocked) {
          const phase = (time / VIBRATION_BEAT_MS) * Math.PI * 2 + this.index * 0.7;
          rx += Math.sin(phase) * VIBRATION_AMPLITUDE;
          ry += Math.cos(phase * 1.3) * VIBRATION_AMPLITUDE * 0.7;
        }

        // Glitch effects
        if (glitchActive && glitchLetters.includes(this.index)) {
          const glitchProgress = (time - glitchStartTime) / glitchDuration;
          if (glitchProgress < 1) {
            const intensity = Math.sin(glitchProgress * Math.PI);
            const mult = overdrive ? overdriveMultiplier : 1;

            rx += (Math.random() - 0.5) * 20 * glitchPosStrength * intensity * mult;
            ry += (Math.random() - 0.5) * 10 * glitchPosStrength * intensity * mult;

            opacity = Math.min(1, opacity + (Math.random() * 0.8) * glitchOpacityStrength * intensity * mult);

            const distFromTear = Math.abs(this.y - glitchTearY);
            if (distFromTear < 30) {
              const tearIntensity = (1 - distFromTear / 30) * intensity;
              rx += (Math.random() > 0.5 ? 1 : -1) * 15 * glitchTearStrength * tearIntensity * mult;
            }
          }
        }

        this.el.style.transform = `translate(${rx}px, ${ry}px)`;
        this.el.style.opacity = opacity;
      }

      get isSettled() {
        if (!this.isLocked || this.targetX === null) return false;
        const dx = Math.abs(this.x - this.targetX);
        const dy = Math.abs(this.y - this.targetY);
        const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
        return dx < 2 && dy < 2 && speed < 0.3;
      }
    }

    const SPACE_EXPANSION = 1.5;

    function measureText(text) {
      const measurer = document.createElement('div');
      measurer.style.cssText = `
        position: absolute;
        visibility: hidden;
        font-family: 'ADolphin', Georgia, serif;
        font-size: 28px;
        white-space: pre;
      `;
      document.body.appendChild(measurer);

      measurer.textContent = ' ';
      const spaceWidth = measurer.getBoundingClientRect().width;
      const extraSpace = spaceWidth * (SPACE_EXPANSION - 1);

      const positions = [];
      let spaceCount = 0;
      for (let i = 0; i < text.length; i++) {
        measurer.textContent = text.substring(0, i);
        const x = measurer.getBoundingClientRect().width + spaceCount * extraSpace;
        positions.push({ char: text[i], x });
        if (text[i] === ' ') spaceCount++;
      }

      measurer.textContent = text;
      const totalWidth = measurer.getBoundingClientRect().width + spaceCount * extraSpace;

      document.body.removeChild(measurer);
      return { positions, totalWidth };
    }

    function lockWord(wordIndex) {
      const line = LINES[currentLine];
      if (wordIndex >= line.words.length) return;

      const wordsToShow = line.words.slice(0, wordIndex + 1);
      const textToShow = wordsToShow.join(' ');

      const { positions, totalWidth } = measureText(textToShow);

      let startX;
      if (line.isFinale) {
        const fullText = line.words.join(' ');
        const { totalWidth: fullWidth } = measureText(fullText);
        startX = centerX - fullWidth / 2;
      } else {
        startX = centerX + anchorWidth / 2 + 8;
      }
      const lineY = anchorY;

      const word = line.words[wordIndex];
      const wordStartInText = wordIndex === 0 ? 0 :
        line.words.slice(0, wordIndex).join(' ').length + 1;

      for (let i = 0; i < word.length; i++) {
        const char = word[i];
        const posIndex = wordStartInText + i;
        const targetX = startX + positions[posIndex].x;
        const targetY = lineY;

        const letter = letters.find(l =>
          l.char === char && !l.isLocked
        );

        if (letter) {
          letter.isLocked = true;
          letter.targetX = targetX;
          letter.targetY = targetY;
          letter.assignment = { lineIndex: currentLine, wordIndex: wordIndex, charIndex: i };
        }
      }
    }

    function lockAllWordsInstant() {
      const line = LINES[currentLine];
      for (let wordIndex = 0; wordIndex < line.words.length; wordIndex++) {
        lockWord(wordIndex);
      }
      currentWord = line.words.length;
    }

    function unlockAllLetters() {
      letters.forEach(l => {
        l.isLocked = false;
        l.targetX = null;
        l.targetY = null;
        l.assignment = null;
      });
      currentWord = 0;
    }

    function dissolveStrach() {
      const strachChars = 'Strach';
      for (const char of strachChars) {
        const letter = new Letter(char, letters.length);
        letter.x = centerX + (Math.random() - 0.5) * 40;
        letter.y = anchorY + (Math.random() - 0.5) * 20;
        letter.opacity = 1;
        letter.baseOpacity = 0.15 + Math.random() * 0.15;
        letters.push(letter);
      }

      document.getElementById('anchor').style.transition = 'opacity 0.3s';
      document.getElementById('anchor').style.opacity = '0';
      finaleMode = true;
    }

    function restoreStrach() {
      document.getElementById('anchor').style.transition = 'opacity 0.3s';
      document.getElementById('anchor').style.opacity = '1';
      finaleMode = false;
    }

    // ============ SCROLL-DRIVEN LINE PROGRESSION ============

    // Each line gets an equal fraction of the scroll range.
    // Within each line's fraction:
    //   0.0 - 0.3 : lock phase (letters animate to position)
    //   0.3 - 0.7 : visible (letters locked in place)
    //   0.7 - 1.0 : unlock phase (letters release back to cloud)

    const LOCK_FRAC = 0.3;
    const VISIBLE_FRAC = 0.4;
    const UNLOCK_FRAC = 0.3;

    let prevActiveLine = -1;
    let prevPhase = 'none';

    function updateScrollState() {
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      scrollProgress = maxScroll > 0 ? window.scrollY / maxScroll : 0;
      scrollProgress = Math.max(0, Math.min(1, scrollProgress));

      // Scroll delta for glitch triggering
      const now = performance.now();
      const dt = now - lastScrollTime;
      if (dt > 0) {
        scrollDelta = Math.abs(window.scrollY - lastScrollY) / dt * 16; // normalize to ~per-frame
      }
      lastScrollY = window.scrollY;
      lastScrollTime = now;
    }

    function getLineState(progress) {
      const numLines = LINES.length;
      const lineFloat = progress * numLines;
      const lineIndex = Math.min(Math.floor(lineFloat), numLines - 1);
      const lineLocalProgress = lineFloat - lineIndex;

      let phase, phaseProgress;

      if (lineLocalProgress < LOCK_FRAC) {
        phase = 'lock';
        phaseProgress = lineLocalProgress / LOCK_FRAC;
      } else if (lineLocalProgress < LOCK_FRAC + VISIBLE_FRAC) {
        phase = 'visible';
        phaseProgress = (lineLocalProgress - LOCK_FRAC) / VISIBLE_FRAC;
      } else {
        phase = 'unlock';
        phaseProgress = (lineLocalProgress - LOCK_FRAC - VISIBLE_FRAC) / UNLOCK_FRAC;
      }

      return { lineIndex, phase, phaseProgress };
    }

    function applyScrollToAnimation() {
      const { lineIndex, phase, phaseProgress } = getLineState(scrollProgress);

      // Detect line or phase change
      const lineChanged = lineIndex !== prevActiveLine;
      const phaseChanged = phase !== prevPhase;

      if (lineChanged || phaseChanged) {
        // Handle Strach visibility for finale
        const wasFinale = prevActiveLine >= 0 && LINES[prevActiveLine] && LINES[prevActiveLine].isFinale;
        const willBeFinale = LINES[lineIndex].isFinale;

        if (!wasFinale && willBeFinale && phase === 'lock') {
          dissolveStrach();
        } else if (wasFinale && !willBeFinale) {
          restoreStrach();
        }

        if (phase === 'lock') {
          // Entering lock phase: release all, then lock words progressively
          unlockAllLetters();
          currentLine = lineIndex;

          // Lock all words (they animate via physics to their targets)
          lockAllWordsInstant();
        } else if (phase === 'visible') {
          // Should already be locked, but ensure
          if (currentLine !== lineIndex || currentWord < LINES[lineIndex].words.length) {
            unlockAllLetters();
            currentLine = lineIndex;
            lockAllWordsInstant();
          }
        } else if (phase === 'unlock') {
          // Release letters back to cloud
          if (currentWord > 0) {
            unlockAllLetters();
          }
          currentLine = lineIndex;
        }

        prevActiveLine = lineIndex;
        prevPhase = phase;
      }
    }

    window.addEventListener('scroll', () => {
      updateScrollState();
      applyScrollToAnimation();
    }, { passive: true });

    // ============ GLITCH (scroll-speed driven) ============

    function checkGlitch(time) {
      // Trigger glitch based on scroll speed
      // scrollDelta is ~pixels per frame; higher = more likely
      const scrollSpeed = Math.min(scrollDelta, 60); // cap
      const probability = (scrollSpeed / 20) * glitchFreq; // fast scroll = high probability

      // Also trigger on beat for ambient shimmer (low probability when idle)
      const beatPhase = (time / VIBRATION_BEAT_MS) % 1;
      const onBeat = beatPhase < 0.05;

      if (onBeat && !glitchActive) {
        const trigger = Math.random() < Math.max(probability, 0.02);
        if (trigger) {
          glitchActive = true;
          glitchStartTime = time;

          glitchLetters = letters
            .filter(() => Math.random() < 0.4)
            .map(l => l.index);

          glitchTearY = centerY + (Math.random() - 0.5) * 200;

          // Faster scroll = overdrive
          overdrive = scrollSpeed > 30;
        }
      }

      if (glitchActive && time - glitchStartTime > glitchDuration) {
        glitchActive = false;
      }
    }

    // ============ ANIMATION LOOP ============

    function animate(time) {
      checkGlitch(time);

      letters.forEach(l => l.verletStep1());
      letters.forEach(l => l.verletStep2(letters));
      letters.forEach(l => {
        l.updateVisuals();
        l.render(time);
      });

      requestAnimationFrame(animate);
    }

    function init() {
      centerX = window.innerWidth / 2;
      centerY = window.innerHeight / 2;

      anchorEl = document.getElementById('anchor');
      const anchorRect = anchorEl.getBoundingClientRect();
      anchorWidth = anchorRect.width;
      const anchorX = centerX - anchorWidth / 2;
      anchorY = centerY - anchorRect.height / 2;
      anchorEl.style.transform = `translate(${anchorX}px, ${anchorY}px)`;

      const pool = buildPool();
      pool.forEach((char, i) => {
        const letter = new Letter(char, i);
        letters.push(letter);
      });

      // Initialize scroll state
      updateScrollState();
      applyScrollToAnimation();

      requestAnimationFrame(animate);
    }

    document.fonts.ready.then(() => {
      init();
    });
  </script>
</body>
</html>
