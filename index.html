<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Animation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            color: #c9c9c9;
            font-family: Georgia, serif;
            min-height: 100vh;
            padding: 40px 20px 80px;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: normal;
            color: #555;
            letter-spacing: 0.2em;
            text-transform: lowercase;
            text-align: center;
            margin-bottom: 40px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(560px, 1fr));
            gap: 32px;
            max-width: 1800px;
            margin: 0 auto;
        }

        .card {
            position: relative;
            background: #000;
            border: 1px solid #1a1a1a;
            border-radius: 4px;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .card:hover {
            border-color: #444;
        }

        .card-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding: 10px 14px;
            border-bottom: 1px solid #111;
        }

        .card-title {
            font-size: 0.95rem;
            color: #e8e4d9;
        }

        .card-num {
            color: #444;
            margin-right: 0.8em;
            font-size: 0.8rem;
        }

        .card-link {
            font-size: 0.75rem;
            color: #555;
            text-decoration: none;
            transition: color 0.2s;
        }

        .card-link:hover {
            color: #e8e4d9;
        }

        .card-desc {
            display: block;
            padding: 6px 14px 8px;
            font-size: 0.72rem;
            color: #555;
            line-height: 1.5;
            border-bottom: 1px solid #111;
        }

        .card iframe {
            display: block;
            width: 100%;
            height: 400px;
            border: none;
            background: #000;
        }

        .card-hint {
            position: absolute;
            bottom: 8px;
            right: 10px;
            font-size: 0.65rem;
            color: #333;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <h1>text animation</h1>

    <div class="grid" id="grid"></div>

    <script>
        const artifacts = [
            { id: '01', name: 'Text Crumble', dir: '01-text-crumble', desc: 'Coupled spring network. Shake propagates through neighbor bonds, then gravity takes over.' },
            { id: '02', name: 'The Weaver', dir: '02-the-weaver', desc: 'Lines assemble from scattered characters and drift upward as new ones form below.' },
            { id: '03', name: 'Crystallization', dir: '03-crystallization', desc: 'Letters orbit in a viscous field, then snap to lattice positions as scroll cools the system.' },
            { id: '04', name: 'Langevin Chaos', dir: '04-langevin-chaos', desc: 'Langevin dynamics with per-word gravity wells. Temperature drops with scroll, freezing thermal noise.' },
            { id: '05', name: 'Neon Flicker', dir: '05-neon-flicker', desc: 'Gaussian probability window slides across words. Each word flickers on near the center and fades at the tails.' },
            { id: '07', name: 'Pixel Letters', dir: '07-pixel-letters', desc: 'Canvas pixel extraction per letter. Pixels scatter radially, then snap back into glyph shapes.' },
            { id: '08', name: 'Text Morph', dir: '08-text-morph', desc: 'LCS match between two phrases. Shared pixels hold position, unmatched ones interpolate via Langevin noise.' },
            { id: '10', name: 'Rest', dir: '10-rest', desc: 'Per-letter neon flicker swap. One vowel changes, transforming the phrase through a glitch transition.' },
            { id: '11', name: 'Fear', dir: '11-strach', desc: 'Verlet physics with orbital cloud. Lines lock into place one by one, then release back into drift.' },
            { id: '13', name: 'Cloud', dir: '13-cloud', desc: 'Curl noise dissolution. Text condenses from particle field, holds, then disperses on the next beat.' },
        ];

        const grid = document.getElementById('grid');

        artifacts.forEach(a => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header">
                    <span class="card-title"><span class="card-num">${a.id}</span>${a.name}</span>
                    <a class="card-link" href="artifacts/${a.dir}/" target="_blank">open</a>
                </div>
                <span class="card-desc">${a.desc}</span>
                <iframe src="artifacts/${a.dir}/" loading="lazy"></iframe>
                <span class="card-hint">scroll inside</span>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
